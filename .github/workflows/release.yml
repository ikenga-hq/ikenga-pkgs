name: Release packages

on:
  push:
    branches: [main]
    # Docs-only pushes can't change what gets versioned or published. The
    # later `.changeset/**` entry re-includes changeset files the `*.md` rule
    # excludes (later patterns win).
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '.changeset/**'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Several build.sh scripts (studio/mcp, sidecars/*) bundle via `bun`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # No test step: every commit reaching main was tested by its PR's CI,
      # and the nightly re-tests main. Re-running the suite here only added a
      # second, flakier gate in front of publishing (most release failures
      # were this step, not the release).

      # minisign is needed BEFORE publish to sign manifests (ADR-017 / WP-06)
      # and again after publish to re-sign the registry index — install once.
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # ADR-017 / WP-06: embed a publisher signature into each elevated-cap pkg's
      # manifest.json BEFORE changesets packs the tarball, so the published
      # tarball ships a signed manifest the shell trust gate can verify. No-op
      # (exit 0) when the PUBLISHER_SIGNING_* secrets aren't set — those pkgs
      # then publish unsigned (Community tier), which is fine: this gates
      # THIRD-PARTY trusted only; the builtin tier ships without a signature.
      - name: Sign pkg manifests
        env:
          PUBLISHER_SIGNING_PRIVATE_KEY: ${{ secrets.PUBLISHER_SIGNING_PRIVATE_KEY }}
          PUBLISHER_SIGNING_PUBLIC_KEY: ${{ secrets.PUBLISHER_SIGNING_PUBLIC_KEY }}
          PUBLISHER_SIGNING_PASSWORD: ${{ secrets.PUBLISHER_SIGNING_PASSWORD }}
        run: node scripts/sign-manifests.mjs

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # version-packages = `changeset version` + sync-manifest-versions, so
          # the Release PR carries manifest.json versions matching package.json
          # (the shell kernel records the manifest version on install — drift
          # here makes updates install but never change the displayed version).
          version: pnpm version-packages
          publish: pnpm changeset publish
          createGithubReleases: true
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update ikenga-registry
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
          REGISTRY_REPO_PAT: ${{ secrets.REGISTRY_REPO_PAT }}
          REGISTRY_SIGNING_PRIVATE_KEY: ${{ secrets.REGISTRY_SIGNING_PRIVATE_KEY }}
          # ADR-017 / WP-06: only the PUBLIC key is needed here — to record the
          # `publisherKey` binding on signed entries in the release-key-signed
          # index. The private key signed the manifests in the step above.
          PUBLISHER_SIGNING_PUBLIC_KEY: ${{ secrets.PUBLISHER_SIGNING_PUBLIC_KEY }}
        run: node scripts/update-registry-index.mjs

      - name: Registry recovery hint
        if: failure() && steps.changesets.outputs.published == 'true'
        run: |
          echo "::notice title=Registry Recovery Path::If registry update failed for packages already on npm, backfill the registry without re-releasing via:"
          echo "  gh workflow run registry-update.yml --repo ikenga-hq/ikenga-pkgs -f published='${{ steps.changesets.outputs.publishedPackages }}'"

      - name: Verify registry index health
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/check-registry-stale.mjs
