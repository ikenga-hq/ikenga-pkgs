name: CI

# Tiered CI:
#   - non-draft PRs into main: full build + drift/version/manifest guards
#     (cheap, whole-fleet by nature), but tests only for the packages the PR
#     changed plus their dependents.
#   - nightly on main + manual dispatch: everything, every package's tests.
# Skipped: drafts (marking ready runs it), docs-only changes, and pushes to
# main (the PR already ran; release.yml builds main; the nightly tests it).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '41 2 * * *' # nightly, all tests on main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # the affected-packages filter below diffs against the PR base
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # @ikenga/studio-mcp bundles via `bun build` (see packages/apps/studio/mcp/build.sh).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # minisign is needed by the sign-manifest round-trip test (scripts/).
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Drift guard: a committed dist/ artifact that doesn't match a fresh build
      # fails CI. Catches the hand-vendored CSS-string drift the tasks build
      # (scripts/build.mjs) was added to kill — and applies to every pkg.
      - run: git diff --exit-code

      # Version drift guard: manifest.json must match package.json in every
      # pkg — the registry advertises the npm version but the shell kernel
      # records the manifest version, so drift makes updates install without
      # ever changing the displayed version.
      - run: pnpm sync:versions:check

      # Manifest schema validation: assert every manifest under packages/ adheres
      # to @ikenga/contract schemas (ManifestSchema / ArtifactManifestSchema).
      - run: pnpm validate:manifests

      # PRs: only packages changed since the base, plus their dependents.
      # Nightly / dispatch: every package.
      - name: Tests (affected on PRs, all otherwise)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            pnpm -r --filter "...[origin/$BASE]" test --if-present
          else
            pnpm -r test --if-present
          fi

      # Cross-language signing gate (ADR-017 / WP-06): canonicalize the frozen
      # golden manifest and assert it equals the golden canonical.json
      # byte-for-byte — proves sign-manifest.mjs agrees with the Rust verifier
      # (pkg/signature.rs) so signed manifests verify in the shell.
      - run: pnpm test:scripts
