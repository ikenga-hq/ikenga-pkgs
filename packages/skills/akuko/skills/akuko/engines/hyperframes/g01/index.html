<!doctype html>
<!--
  G-01 composition (WP-11): "preview must equal render".
  1920x1080, 6 s, three primitives (KenBurns, Stat with a counter, CaptionBar).
  Rules under test (plan Round 5):
    R5-4  fonts are vendored @font-face woff2 (the harness stages blocks/fonts/ next to this file as fonts/);
    R5-5  state is a pure function of timeline time (the counter text is written by a
          property GSAP sets on every render, seeks included, never only in a callback).
  The block between COUNTER:BEGIN and COUNTER:END is swapped by g01.ts for the spike's
  onUpdate-only counter to build the negative control; nothing else differs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>akuko G-01</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: block; src: url("fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: block; src: url("fonts/inter-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 600; font-display: block; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 700; font-display: block; src: url("fonts/newsreader-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 600; font-display: block; src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }

      :root {
        --ground: #0d0b0a;
        --surface: #171412;
        --raised: #221e1b;
        --line: #2e2824;
        --ink: #efe8df;
        --muted: #9a9087;
        --accent: #d9a441;
        --accent-soft: #3a2d14;
        --warm: #6b3a22;
        --font-sans: "Inter", sans-serif;
        --font-display: "Newsreader", serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* KenBurns: a slow push on a still (here a colour-block plate). */
      .kb-viewport {
        position: absolute; left: 260px; top: 100px; width: 1400px; height: 760px;
        border-radius: 20px; overflow: hidden; background: #070605; border: 1px solid var(--line);
      }
      .kb-plate { position: absolute; inset: -40px; transform-origin: 40% 45%; }
      .kb-grid {
        position: absolute; inset: 0; display: grid; gap: 16px; padding: 40px;
        grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr);
      }
      .kb-grid > div { border-radius: 12px; }
      .p1 { grid-column: 1 / 4; grid-row: 1 / 3; background: #241f1b; }
      .p2 { grid-column: 4 / 7; grid-row: 1 / 2; background: #4a2818; }
      .p3 { grid-column: 4 / 6; grid-row: 2 / 4; background: #1c1916; }
      .p4 { grid-column: 6 / 7; grid-row: 2 / 5; background: #33290f; }
      .p5 { grid-column: 1 / 3; grid-row: 3 / 5; background: #1a1613; }
      .p6 { grid-column: 3 / 4; grid-row: 3 / 5; background: #3b2116; }
      .p7 { grid-column: 4 / 6; grid-row: 4 / 5; background: #26211d; }

      /* Stat: kicker, counter, unit, context. Fixed boxes so the harness's text regions are stable. */
      .stat-card {
        position: absolute; left: 610px; top: 230px; width: 700px; height: 340px;
        background: #14110f; border: 1px solid var(--line); border-radius: 24px;
      }
      .stat-kicker {
        position: absolute; left: 0; right: 0; top: 48px; text-align: center;
        font-family: var(--font-mono); font-weight: 600; font-size: 16px; letter-spacing: 0.3em;
        text-transform: uppercase; color: var(--accent);
      }
      .stat-hero {
        position: absolute; left: 0; right: 0; top: 92px; height: 150px;
        display: flex; align-items: baseline; justify-content: center; gap: 14px;
      }
      .stat-number {
        font-family: var(--font-display); font-weight: 700; font-size: 150px; line-height: 150px;
        font-variant-numeric: tabular-nums; color: var(--ink);
      }
      .stat-unit { font-family: var(--font-sans); font-weight: 500; font-size: 48px; color: var(--muted); }
      .stat-context {
        position: absolute; left: 0; right: 0; top: 262px; text-align: center;
        font-family: var(--font-sans); font-weight: 400; font-size: 22px; color: var(--muted);
      }

      /* CaptionBar: one phrase at a time in a pill. */
      .cap-pill {
        position: absolute; left: 460px; top: 952px; width: 1000px; height: 64px;
        background: #14110f; border: 1px solid var(--line); border-radius: 999px;
      }
      .cap-phrase {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px;
        font-family: var(--font-sans); font-weight: 500; font-size: 22px; color: var(--ink); opacity: 0;
      }
      .cap-step {
        font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--accent); background: var(--accent-soft);
        padding: 4px 10px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="30">
      <div id="kenburns" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="kb-viewport">
          <div id="kb-plate" class="kb-plate">
            <div class="kb-grid">
              <div class="p1"></div><div class="p2"></div><div class="p3"></div><div class="p4"></div>
              <div class="p5"></div><div class="p6"></div><div class="p7"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="stat" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="stat-card" class="stat-card">
          <div id="stat-kicker" class="stat-kicker">Estimated runtime</div>
          <div class="stat-hero">
            <span id="stat-num" class="stat-number">0</span>
            <span id="stat-unit" class="stat-unit">min</span>
          </div>
          <div id="stat-context" class="stat-context">From script breakdown to picture lock</div>
        </div>
      </div>

      <div id="caption" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <div class="cap-pill">
          <div id="phrase-1" class="cap-phrase"><span class="cap-step">Step 1</span><span>Breakdown and bibles</span></div>
          <div id="phrase-2" class="cap-phrase"><span class="cap-step">Step 2</span><span>Sketch board and key frames</span></div>
          <div id="phrase-3" class="cap-phrase"><span class="cap-step">Step 3</span><span>Clips, sound and the final cut</span></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // KenBurns: linear push over the whole shot.
      tl.to("#kb-plate", { scale: 1.15, x: -40, y: -20, duration: 6, ease: "none" }, 0);

      // Stat entrance ("settle": back.out(1.5) over 1.0 s).
      tl.from("#stat-card", { opacity: 0, scale: 0.85, y: 60, duration: 1.0, ease: "back.out(1.5)" }, 0.2);
      tl.from("#stat-kicker", { opacity: 0, y: -10, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from("#stat-unit", { opacity: 0, duration: 0.5, ease: "power2.out" }, 0.6);
      tl.from("#stat-context", { opacity: 0, y: 15, duration: 0.6, ease: "power2.out" }, 0.8);

      /* COUNTER:BEGIN */
      // Counter 0 -> 20 from 0.3 s over 1.8 s (power2.out), as a pure function of timeline time.
      // A linear clock tween spans the timeline; GSAP writes its value on every render, including
      // seeks with suppressEvents, so the text never depends on a callback firing.
      const numEl = document.getElementById("stat-num");
      const counterEase = gsap.parseEase("power2.out");
      const counterAt = (t) => {
        const p = Math.min(1, Math.max(0, (t - 0.3) / 1.8));
        return Math.round(20 * counterEase(p));
      };
      const clock = {
        get t() { return 0; },
        set t(time) { numEl.textContent = String(counterAt(time)); }
      };
      tl.fromTo(clock, { t: 0 }, { t: 6, duration: 6, ease: "none", immediateRender: true }, 0);
      /* COUNTER:END */

      // CaptionBar: three phrases in sequence.
      tl.fromTo("#phrase-1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.to("#phrase-1", { opacity: 0, y: -8, duration: 0.25, ease: "power2.in" }, 2.0);
      tl.fromTo("#phrase-2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.25);
      tl.to("#phrase-2", { opacity: 0, y: -8, duration: 0.25, ease: "power2.in" }, 4.0);
      tl.fromTo("#phrase-3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.25);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
