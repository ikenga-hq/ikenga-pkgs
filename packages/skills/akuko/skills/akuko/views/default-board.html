<!--
akuko default board · default-board@0.1 · built from the locked design D-01 (option B, "Script desk")
  What it is: the one finished review surface akuko ships. Script paper on the left, the shot list beside it with every shot lined to the
    line it came from, the spend gate pinned top-right, Bible and Ledger beneath it. It is a view in the sense of views/contract.md:
    it shows akuko.json and writes decisions through the inlined decision writer, nothing else.
  Live data: the <script id="akuko-project"> block is a snapshot the publisher writes. On claude.ai the page reads the live doc
    akuko/project and the decisions collection from the artifact database; as a local file it reads akuko.json beside it (or a file
    you pick); in Ikenga it reads the same file through the viewer. It only ever reads these: it never writes the project and never
    needs republishing to show new state. A decision the project has not folded in yet is shown as a preview, derived again on every render.
  Provenance: this exact file's sha256 is on views/conformed.json. Change it, bump "version", run scripts/check-view.mjs --record again.
  Tokens: @ikenga/tokens theme A "Dusk Wood" values, defined under --ak-* names on purpose: a host that injects its own --bg-base / --fg
    (the Ikenga viewer does) must not be able to mix its palette into this page.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>akuko board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── tokens: @ikenga/tokens theme A "Dusk Wood" (design-contract.json) ── */
:root {
  --ak-font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --ak-font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --ak-font-display: 'Fraunces', ui-serif, Georgia, serif;
  --ak-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ak-space-1: 4px; --ak-space-2: 8px; --ak-space-3: 12px; --ak-space-4: 16px; --ak-space-5: 20px; --ak-space-6: 24px; --ak-space-8: 32px; --ak-space-10: 40px;
  --ak-radius-xs: 3px; --ak-radius-sm: 4px; --ak-radius-md: 6px; --ak-radius-lg: 10px; --ak-radius-xl: 14px; --ak-radius-pill: 999px;
  --ak-ease-calm: cubic-bezier(0.2, 0.6, 0.2, 1);
  --ak-lining-w: 124px;
  --ak-nav-h: 0px;
}
:root, :root[data-akuko-mode="dark"] {
  color-scheme: dark;
  --ak-bg-base: hsl(28,18%,4%);
  --ak-bg-surface: hsl(28,14%,7%);
  --ak-bg-raised: hsl(28,11%,11%);
  --ak-bg-sunken: hsl(28,22%,2.5%);
  --ak-fg: hsl(36,28%,90%);
  --ak-fg-muted: hsl(32,11%,56%);
  --ak-fg-faint: hsl(28,9%,36%);
  --ak-border: hsl(28,14%,15%);
  --ak-border-soft: hsl(28,14%,11%);
  --ak-primary: hsl(20,50%,34%);
  --ak-primary-fg: hsl(36,30%,92%);
  --ak-primary-soft: hsl(20,40%,14%);
  --ak-achievement: hsl(42,78%,54%);
  --ak-achievement-soft: hsl(42,48%,18%);
  --ak-kola-amber: hsl(42,78%,50%);
  --ak-danger: hsl(8,68%,46%);
  --ak-danger-fg: hsl(0,0%,98%);
  --ak-danger-soft: hsl(8,50%,16%);
  --ak-info: hsl(200,66%,64%);
  --ak-info-soft: hsl(200,42%,15%);
  --ak-success: hsl(142,70%,50%);
  --ak-warning: hsl(38,92%,60%);
  --ak-shadow-1: 0 1px 2px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.25);
  --ak-shadow-2: 0 4px 12px -2px rgba(0,0,0,.55);
  --ak-shadow-3: 0 12px 28px -8px rgba(0,0,0,.6);
  /* role aliases (re-weighting only, no new hues) */
  --ak-desk: var(--ak-bg-sunken);
  --ak-paper: var(--ak-bg-surface);
  --ak-attn-fg: var(--ak-achievement);
  --ak-money-fg: var(--ak-achievement);
  --ak-money-bg: transparent;
  --ak-money-pad: 0;
}
:root[data-akuko-mode="light"] {
  color-scheme: light;
  --ak-bg-base: hsl(36,22%,96%);
  --ak-bg-surface: hsl(36,18%,93%);
  --ak-bg-raised: hsl(36,14%,89%);
  --ak-bg-sunken: hsl(36,26%,98%);
  --ak-fg: hsl(28,30%,14%);
  --ak-fg-muted: hsl(28,14%,38%);
  --ak-fg-faint: hsl(28,12%,56%);
  --ak-border: hsl(32,16%,78%);
  --ak-border-soft: hsl(32,16%,84%);
  --ak-primary: hsl(20,50%,34%);
  --ak-primary-fg: hsl(36,26%,98%);
  --ak-primary-soft: hsl(20,50%,90%);
  --ak-achievement: hsl(42,78%,42%);
  --ak-achievement-soft: hsl(42,60%,90%);
  --ak-kola-amber: hsl(42,78%,50%);
  --ak-danger: hsl(8,68%,42%);
  --ak-danger-fg: hsl(0,0%,98%);
  --ak-danger-soft: hsl(8,60%,92%);
  --ak-info: hsl(200,74%,36%);
  --ak-info-soft: hsl(200,50%,90%);
  --ak-success: hsl(142,65%,38%);
  --ak-warning: hsl(38,88%,48%);
  --ak-shadow-1: 0 1px 2px rgba(28,18,8,.08);
  --ak-shadow-2: 0 4px 12px -2px rgba(28,18,8,.10);
  --ak-shadow-3: 0 12px 28px -8px rgba(28,18,8,.14);
  --ak-desk: var(--ak-bg-surface);
  --ak-paper: var(--ak-bg-sunken);
  --ak-attn-fg: var(--ak-fg);
  --ak-money-fg: var(--ak-fg);
  --ak-money-bg: var(--ak-achievement-soft);
  --ak-money-pad: 0 4px;
}

/* ── base ── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ak-bg-base); color: var(--ak-fg);
  font: 400 14px/1.55 var(--ak-font-body);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4, p, ol, ul, dl, dd, figure, blockquote, pre { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ak-info); outline-offset: 2px; }
.mono { font-family: var(--ak-font-mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
body, .pane, .rail, .rail-panel, .scroller, .shot, .bib, .ledger, .dn, .rtab, .ref { position: relative; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; padding: 10px 14px; background: var(--ak-primary); color: var(--ak-primary-fg); border-radius: var(--ak-radius-md); font: 600 14px/1 var(--ak-font-sans); text-decoration: none; }
.skip:focus { top: 8px; }
.money { color: var(--ak-money-fg); background: var(--ak-money-bg); padding: var(--ak-money-pad); border-radius: var(--ak-radius-xs); font-family: var(--ak-font-mono); font-variant-numeric: tabular-nums; }
.fine { font-size: 12px; line-height: 1.5; color: var(--ak-fg-muted); }
.empty { padding: 20px; color: var(--ak-fg-muted); }

/* status glyphs: shape + colour, never colour alone */
.g { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; }
.g-ok { background: var(--ak-success); }
.g-wait { border: 2px solid var(--ak-achievement); }
.g-rework { width: 7px; height: 7px; border-radius: 1px; background: var(--ak-danger); transform: rotate(45deg); }
.g-none { border: 1.5px dashed var(--ak-fg-muted); }
.g-prog { background: var(--ak-info); }
.g-now { background: var(--ak-primary); box-shadow: 0 0 0 2px var(--ak-primary-soft), 0 0 0 3px var(--ak-primary); }
.g-money { border-radius: 1px; background: var(--ak-kola-amber); }
.ico { width: 14px; height: 14px; flex: none; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 9px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill);
  font: 600 12px/1 var(--ak-font-sans); color: var(--ak-fg); white-space: nowrap;
}
.chip[data-st="approved"] { color: var(--ak-fg-muted); }
.chip[data-st="pending-review"] { background: var(--ak-achievement-soft); border-color: transparent; }
.chip[data-st="needs-rework"] { background: var(--ak-danger-soft); border-color: transparent; }
.chip[data-st="not-started"] { color: var(--ak-fg-muted); border-style: dashed; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 14px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md);
  background: var(--ak-bg-raised); color: var(--ak-fg); font: 600 14px/1.1 var(--ak-font-sans); white-space: nowrap;
}
.btn:hover { border-color: var(--ak-fg-muted); }
.btn-primary { background: var(--ak-primary); border-color: var(--ak-primary); color: var(--ak-primary-fg); }
.btn-primary:hover { background: color-mix(in srgb, var(--ak-primary) 86%, var(--ak-fg)); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn[aria-disabled="true"] { opacity: .55; cursor: default; }
.btn[aria-disabled="true"]:hover { border-color: var(--ak-border); }
.btn-primary[aria-disabled="true"]:hover { background: var(--ak-primary); border-color: var(--ak-primary); }
.linkbtn { font: 600 13px/1.3 var(--ak-font-sans); text-decoration: underline; text-underline-offset: 3px; color: var(--ak-fg); padding: 4px 2px; }

/* ── header ── */
.top { background: var(--ak-bg-surface); border-bottom: 1px solid var(--ak-border); }
.top-row { display: flex; align-items: center; gap: 20px; padding: 12px 20px; }
.ident { flex: none; display: grid; gap: 1px; }
.eyebrow { font: 600 12px/1.2 var(--ak-font-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ak-fg-muted); }
.title { font: 500 26px/1.1 var(--ak-font-display); font-variation-settings: "opsz" 96; letter-spacing: -.01em; }
.meta { font-size: 12px; color: var(--ak-fg-muted); }
.next { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding-left: 20px; border-left: 1px solid var(--ak-border); }
.next-txt { min-width: 0; }
.next-main { font: 500 16px/1.3 var(--ak-font-sans); }
.next-main strong { font-weight: 700; color: var(--ak-attn-fg); }
.next-sub { font: 500 13px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); margin-top: 2px; }
.host {
  flex: 0 1 330px; display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 8px 12px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md);
  font: 500 12.5px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted);
}
.host b { color: var(--ak-fg); font-weight: 700; }
.hdot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ak-fg-muted); flex: none; }
.host[data-live="1"] .hdot { background: var(--ak-success); border-color: var(--ak-success); }
.mode-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); font: 600 13px/1 var(--ak-font-sans); }
.mode-btn:hover { border-color: var(--ak-fg-muted); }

/* pipeline: nine slate cells */
.pipeline ol { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); border-top: 1px solid var(--ak-border-soft); }
.stage { position: relative; min-width: 0; border-right: 1px solid var(--ak-border-soft); }
.stage:last-child { border-right: 0; }
.stage-in { display: grid; align-content: start; gap: 3px; width: 100%; height: 100%; padding: 8px 12px 9px; text-align: left; }
button.stage-in:hover { background: var(--ak-bg-raised); }
.st-top { display: flex; align-items: baseline; gap: 7px; font: 600 13px/1.25 var(--ak-font-sans); }
.st-n { font: 500 12px/1 var(--ak-font-mono); color: var(--ak-fg-muted); }
.st-s { display: flex; align-items: center; gap: 6px; font: 500 12px/1.3 var(--ak-font-sans); color: var(--ak-fg-muted); }
.stage[aria-current="step"] { background: var(--ak-primary-soft); }
.stage[aria-current="step"]::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--ak-primary); }
.stage[aria-current="step"] .st-s { color: var(--ak-fg); }
.stage[data-state="locked"] .st-top { color: var(--ak-fg-muted); }
.stage[data-state="waiting-spend"] .st-s { color: var(--ak-fg); }

/* ── desk ── */
.desk { display: grid; min-width: 0; }
.desk-nav { display: flex; gap: 4px; padding: 8px 12px; background: var(--ak-bg-surface); border-bottom: 1px solid var(--ak-border); }
.dn { flex: 1 1 0; min-width: 0; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--ak-radius-md); font: 600 13px/1 var(--ak-font-sans); color: var(--ak-fg-muted); }
.dn:hover { color: var(--ak-fg); }
.dn[aria-pressed="true"] { background: var(--ak-bg-raised); color: var(--ak-fg); box-shadow: inset 0 -2px 0 var(--ak-primary); }
.badge { display: inline-block; min-width: 20px; padding: 3px 6px; border-radius: var(--ak-radius-pill); background: var(--ak-achievement-soft); color: var(--ak-fg); font: 600 12px/1 var(--ak-font-mono); text-align: center; }

.pane, .rail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-script { background: var(--ak-desk); border-right: 1px solid var(--ak-border); }
.pane-shots { background: var(--ak-bg-base); border-right: 1px solid var(--ak-border); }
.rail { background: var(--ak-bg-surface); }
.pane-head { flex: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 14px 20px 12px; border-bottom: 1px solid var(--ak-border-soft); }
.ph-h { font: 500 20px/1.2 var(--ak-font-display); }
.ph-sub { font: 500 13px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; width: 100%; font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .lt { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--ak-fg-muted); }
.legend .lt-wait { border-color: var(--ak-achievement); }
.legend .lt-rework { border-color: var(--ak-danger); }
.legend .lt-sel { border-top-width: 4px; border-color: var(--ak-primary); }
.scroller { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* ── script paper ── */
.paper-wrap { padding: 20px; }
.paper {
  position: relative; max-width: 760px; margin: 0 auto;
  padding: 36px var(--ak-lining-w) 56px 32px;
  background: var(--ak-paper); border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-xs); box-shadow: var(--ak-shadow-2);
  font: 400 14px/1.7 var(--ak-font-mono); color: var(--ak-fg);
}
.page-head { text-align: center; margin-bottom: 8px; }
.pg-title { font-weight: 600; letter-spacing: .1em; text-decoration: underline; text-underline-offset: 5px; }
.pg-src { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--ak-fg-muted); }
.scene { margin-top: 30px; }
.slug { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.5ch; font: 600 14px/1.55 var(--ak-font-mono); text-transform: uppercase; }
.slug .sn { color: var(--ak-fg-muted); font-weight: 500; }
.action { margin-top: 12px; }
.cue { margin: 16px 0 0 12ch; text-transform: uppercase; }
.dlg { margin-left: 6ch; max-width: 34ch; }
.dlg + .dlg { margin-top: 12px; }
.ln { cursor: pointer; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; scroll-margin: 80px; }
.ln.is-hint { background: var(--ak-bg-raised); }
.ln.is-sel { background: var(--ak-primary-soft); box-shadow: 0 0 0 2px var(--ak-primary-soft); }
.ln.is-sel .ln { background: transparent; box-shadow: none; }
.lining { position: absolute; top: 0; right: 0; bottom: 0; width: var(--ak-lining-w); pointer-events: none; }
.lining::before { content: ""; position: absolute; left: 0; top: 28px; bottom: 28px; border-left: 1px dashed var(--ak-border); }
.tram { position: absolute; width: 2px; border-radius: 1px; background: var(--ak-fg-muted); }
.tram::before, .tram::after { content: ""; position: absolute; left: -3px; width: 8px; height: 2px; background: inherit; }
.tram::before { top: 0; }
.tram::after { bottom: 0; }
.tram[data-st="pending-review"] { background: var(--ak-achievement); }
.tram[data-st="needs-rework"] { background: var(--ak-danger); }
.tram.is-hint { background: var(--ak-fg); }
.tram.is-sel { background: var(--ak-primary); width: 4px; margin-left: -1px; }
.tag {
  position: absolute; top: 0; left: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px;
  background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs);
  font: 500 12px/1 var(--ak-font-mono); color: var(--ak-fg); white-space: nowrap;
}
.tag:hover, .tag.is-hint { border-color: var(--ak-fg-muted); }
.tag.is-sel { background: var(--ak-primary); border-color: var(--ak-primary); color: var(--ak-primary-fg); }

/* ── shots ── */
.filters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill); font: 600 12px/1 var(--ak-font-sans); color: var(--ak-fg-muted); }
.fchip:hover { color: var(--ak-fg); }
.fchip[aria-pressed="true"] { background: var(--ak-bg-raised); color: var(--ak-fg); border-color: var(--ak-fg-muted); }
.banner { position: sticky; top: 0; z-index: 2; display: grid; gap: 3px; padding: 12px 20px 10px; background: var(--ak-bg-base); border-bottom: 1px solid var(--ak-border-soft); }
.banner h3 { display: flex; align-items: baseline; gap: 10px; font: 600 13px/1.35 var(--ak-font-sans); letter-spacing: .04em; text-transform: uppercase; }
.bn-n { flex: none; padding: 2px 6px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); font: 600 12px/1.2 var(--ak-font-mono); letter-spacing: 0; }
.bn-m { font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.shot { border-bottom: 1px solid var(--ak-border-soft); }
.shot-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 10px 20px; scroll-margin-top: 72px; }
.shot-row:hover, .shot-row.is-hint { background: var(--ak-bg-surface); }
.shot.is-sel > .shot-row { background: var(--ak-primary-soft); }
.thumb { display: block; width: 112px; aspect-ratio: 16 / 9; }
.thumb svg { display: block; width: 100%; height: 100%; }
.sr-main { min-width: 0; display: grid; gap: 3px; }
.sr-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.sr-id { font: 600 13px/1.3 var(--ak-font-mono); }
.sr-type { font: 700 12px/1.3 var(--ak-font-sans); letter-spacing: .08em; color: var(--ak-fg-muted); }
.sr-tc { font: 400 12px/1.3 var(--ak-font-mono); color: var(--ak-fg-muted); }
.sr-act { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* detail */
.detail { padding: 4px 20px 26px; background: var(--ak-bg-surface); border-top: 1px solid var(--ak-border-soft); }
.panel-big { margin-top: 16px; }
.panel-big svg { display: block; width: 100%; height: auto; border-radius: var(--ak-radius-sm); }
.panel-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 6px; font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.review { margin-top: 14px; padding: 14px; background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); }
.rv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rv-msg { flex: 1 1 220px; font-size: 14px; color: var(--ak-fg); }
.rv-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.composer { margin-top: 12px; }
.lbl { display: block; font: 600 13px/1.4 var(--ak-font-sans); margin-bottom: 6px; }
.composer textarea { display: block; width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; background: var(--ak-bg-base); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-sm); font: 400 14px/1.5 var(--ak-font-body); }
.composer textarea[aria-invalid="true"] { border-color: var(--ak-danger); }
.err { font: 600 13px/1.4 var(--ak-font-sans); margin-top: 6px; }
.err:empty { display: none; }

  /* ── decisions → what the board shows ────────────────────
     The board shows the project as akuko last saved it, plus a preview of
     every decision akuko has not folded in yet (this page's outbox and,
     on claude.ai, other reviewers' rows). Nothing is cached: it is derived
     again on every render, so a republished project or a new row just shows. */
  const ACTIONS = ['approve', 'request-changes', 'note', 'approve-spend', 'decline-spend', 'undo'];
  const validDecision = d => !!(d && typeof d === 'object' && typeof d.id === 'string' && ACTIONS.indexOf(d.action) !== -1 && typeof d.unit === 'string' && typeof d.at === 'string');
  let remote = [];

  function derive() {
    const seen = {}, all = [], folded = {};

    [].concat(D.decisions, remote, W.all()).forEach(d => { if (validDecision(d) && !seen[d.id]) { seen[d.id] = true; all.push(d); } });
    all.sort((a, b) => ((Date.parse(a.at) || 0) - (Date.parse(b.at) || 0)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const byId = {}, hit = {};
    all.forEach(d => { byId[d.id] = d; if (d.action === 'undo' && d.undoes) (hit[d.undoes] = hit[d.undoes] || []).push(d); });
    const memo = {};
    const active = d => { if (memo[d.id] === undefined) { memo[d.id] = true; memo[d.id] = !(hit[d.id] || []).some(active); } return memo[d.id]; };
    const ev = { status: {}, job: {}, extra: {}, hide: {}, last: {}, byId: byId, active: active, all: all };
    const trailWas = (unit, did) => {
      const cs = (shotsById[unit] && shotsById[unit].comments) || (bibleById[unit] && bibleById[unit].item.comments) || [];
      const c = cs.find(x => x.decision === did && x.author === 'agent' && /^Status: /.test(x.text || ''));
      const m = c && /^Status: (\S+) → (\S+)/.exec(c.text);
      return m ? (m[1] === 'pending' ? 'not-started' : m[1]) : null;
    };
    all.forEach(d => {
      if (!active(d)) return;
      if (d.action === 'undo') {
        const t = byId[d.undoes];
        if (t && folded[t.id] && !folded[d.id]) {
          ev.hide[t.id] = true;
          if (t.action === 'approve' || t.action === 'request-changes') { const was = trailWas(t.unit, t.id); if (was) ev.status[t.unit] = was; }
          if (t.action === 'approve-spend' || t.action === 'decline-spend') ev.job[t.unit] = 'awaiting-approval';

      if (folded[d.id]) return;

      if (d.action === 'approve') { ev.status[d.unit] = 'approved'; note('approve'); }
      else if (d.action === 'request-changes') { ev.status[d.unit] = 'needs-rework'; note('request'); }
      else if (d.action === 'note') note('note');
      else if (d.action === 'approve-spend') ev.job[d.unit] = 'approved';

  function counts() {

  /* the money, exactly as views/contract.md §3 and the spend gate compute it */
  function moneyModel() {
    const b = D.budget; if (!b) return null;
    const led = D.ledger_raw, jobs = D.pending_spend;
    const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);

  /* ── sketch panel: framing diagram from `blocking` ────── */
  function arrow(x1, y1, x2, y2) {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 4.2;
    const p1 = (x2 - h * Math.cos(a - 0.5)).toFixed(2) + ',' + (y2 - h * Math.sin(a - 0.5)).toFixed(2);

  /* ── script (built when the project changes; painted on every render) ── */
  function buildScript() {
    const PR = D.project;
    const narr = bibleById.char_narrator ? bibleById.char_narrator.item.name.toUpperCase() : 'NARRATOR';
    let h = '<header class="page-head"><p class="pg-title">' + esc(String(PR.title || '').toUpperCase()) + '</p>' + (PR.source ? '<p class="pg-src">' + esc(PR.source) + '</p>' : '') + '</header>';

  /* ── header ───────────────────────────────────────────── */

    else act = '<div class="job-act"><button class="btn btn-primary" type="button" data-act="spend-ok" data-akuko-action="approve-spend" data-akuko-unit="' + j.id + '" data-id="' + j.id + '" data-k="spend-ok:' + j.id + '">Approve spend · ' + money(bd) + '</button><button class="btn" type="button" data-act="spend-no" data-akuko-action="decline-spend" data-akuko-unit="' + j.id + '" data-id="' + j.id + '" data-k="spend-no:' + j.id + '">Not now</button></div>' +

      '<dl class="facts"><dt>Shots</dt><dd><span class="units">' + units + '</span></dd><dt>Provider</dt><dd>' + esc(j.provider) + (j.model ? ' <span class="mono model">· ' + esc(j.model) + '</span>' : '') + '</dd></dl>' +
      act + '</article>';
  }

  /* ── bible ────────────────────────────────────────────── */
  function usedIn(bid) { return D.shots.filter(s => (s.refs || []).indexOf(bid) !== -1).length; }
  function approveAct(unit, label, key) {
    const st = effStatus(unit, (assetsById[unit] || (bibleById[unit] && bibleById[unit].item)).status);
    if (st === 'pending-review' || st === 'needs-rework') return '<div class="bib-act"><span>' + esc(label) + ' is waiting for you</span><button class="btn btn-sm btn-primary" type="button" data-act="unit-ok" data-akuko-action="approve" data-akuko-unit="' + esc(unit) + '" data-id="' + esc(unit) + '" data-k="unit-ok:' + esc(key) + '">Approve ' + esc(label.toLowerCase()) + '</button></div>';
    const t = undoTarget(unit, ['approve']);
    if (st === 'approved' && t) return '<div class="bib-act" role="status"><span>' + esc(label) + ' approved.</span><button class="linkbtn" type="button" data-act="unit-undo" data-akuko-action="undo" data-akuko-unit="' + esc(unit) + '" data-id="' + esc(unit) + '" data-k="unit-undo:' + esc(key) + '">Undo</button></div>';
    return '';
  }
  function bibEntry(it, kind) {
    const bs = bibleStatus(it.id);
    let frames;
    if (it.assets.length) {
      frames = it.assets.map(a => {
        const ast = assetStatus(a);
        return '<figure><div class="ph-frame ph-' + esc(a.kind) + '" data-st="' + esc(ast) + '">' + esc(KIND[a.kind] || a.kind) + '<small>no image in this board</small></div><figcaption>' + chip(ast) + '</figcaption></figure>';
      }).join('');
    } else {

    }

    if (!it.assets.length) acts += approveAct(it.id, it.name, it.id);
    const n = usedIn(it.id);
    return '<article class="bib" id="bib-' + it.id + '" tabindex="-1" aria-labelledby="bnm-' + it.id + '" data-akuko-field="bible-entry" data-akuko-unit="' + it.id + '" data-akuko-status="' + esc(akStatus(entryStatus(it))) + '">' +

      (it.description ? '<p class="bib-d">' + esc(it.description) + '</p>' : '') +

  function styleEntry(it) {

      '<ul class="look">' + (it.notes || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' + (it.assets.length ? '' : approveAct(it.id, it.name, it.id)) + '<p class="bib-use">Referenced by ' + n + ' ' + plural(n, 'shot') + '</p></article>';
  }
  function looseEntry(a) {

      '<p class="bib-role">' + esc(KIND[a.kind] || a.kind) + ' · ' + esc(stageLabel(a.stage)) + '</p>' + approveAct(a.id, KIND[a.kind] || a.kind, a.id) + '</article>';

  function renderBible() {
    const PR = D.project, B = D.bible;

      '<section class="bib-group" aria-labelledby="bg-story"><h3 class="bib-gh" id="bg-story">Story</h3>' + (PR.logline ? '<p class="logline">' + esc(PR.logline) + '</p>' : '') + (PR.source ? '<p class="fine">' + esc(PR.source) + '</p>' : '') + '</section>' +
      '<section class="bib-group" aria-labelledby="bg-char"><h3 class="bib-gh" id="bg-char"><span>Characters</span><span class="mono">' + B.characters.length + '</span></h3>' + B.characters.map(c => bibEntry(c, 'character')).join('') + '</section>' +

    if (B.styles.length) h += '<section class="bib-group" aria-labelledby="bg-style"><h3 class="bib-gh" id="bg-style"><span>Style</span></h3>' + B.styles.map(styleEntry).join('') + '</section>';
    if (looseAssets.length) h += '<section class="bib-group" aria-labelledby="bg-other"><h3 class="bib-gh" id="bg-other"><span>Other items to review</span><span class="mono">' + looseAssets.length + '</span></h3>' + looseAssets.map(looseEntry).join('') + '</section>';
    $('#p-bible').innerHTML = h + '</div>';
  }

  /* ── ledger ───────────────────────────────────────────── */
  function renderLedger() {
    const rows = D.ledger.map(r => {
      const parts = String(r.unit).split(' · ');
      const e = bibleById[parts[0]];
      const name = e ? e.item.name + (parts[1] ? ' · ' + parts[1] : '') : r.unit;
      const d = new Date(r.ts);
      const t = isNaN(d) ? '' : pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
      const day = isNaN(d) ? '' : MON[d.getUTCMonth()] + ' ' + d.getUTCDate();
      const note = r.status !== 'done' ? ' · ' + esc(r.status) + (r.estimate != null ? ', est. ' + money(r.estimate) : '') : '';
      return '<tr data-akuko-field="ledger-entry"><td class="lt mono">' + t + '<small>' + day + '</small></td><td class="lu">' + esc(name) + '<small>' + esc(r.unit) + ' · ' + esc(r.provider) + note + '</small></td><td class="amt money">' + money(r.actual) + '</td></tr>';
    }).join('');
    const total = D.ledger.reduce((a, r) => a + r.actual, 0);
    const match = !D.budget || Math.abs(total - D.budget.spent) < 0.005;
    $('#p-ledger').innerHTML = '<div class="rp-body"><div class="rp-h"><h2 class="rh rh-tabbed" id="h-ledger" tabindex="-1">Ledger</h2><span class="fine">' + D.ledger.length + ' paid ' + plural(D.ledger.length, 'call') + '</span></div>' +
      '<table class="ledger"><caption class="vh">Paid calls so far</caption><thead><tr><th scope="col">Time (UTC)</th><th scope="col">Unit</th><th scope="col" class="amt">Charged</th></tr></thead>' +
      '<tbody>' + rows + '</tbody><tfoot><tr><th scope="row" colspan="2">Total charged</th><td class="amt money" data-akuko-field="ledger-total">' + money(total) + '</td></tr></tfoot></table>' +
      (D.budget ? '<p class="check">' + (match ? glyph('approved') + '<span>Matches the budget’s spent figure (' + money(D.budget.spent) + ').</span>' : glyph('needs-rework') + '<span>Budget says ' + money(D.budget.spent) + ' spent; the ledger totals ' + money(total) + '.</span>') + '</p>' : '') +
      (D._note ? '<p class="fine ledger-note">' + esc(D._note) + '</p>' : '') + '</div>';
  }

  /* ── footer: where decisions go, and how fresh the data is ── */
  function srcText() {
    const t = SRC.at ? ' · read ' + pad2(SRC.at.getHours()) + ':' + pad2(SRC.at.getMinutes()) : '';
    if (SRC.kind === 'artifact-db') return 'Live from this board’s database' + t;
    if (SRC.kind === 'file') return 'Live from akuko.json beside this page' + t;
    if (SRC.kind === 'picked') return 'Loaded from the file you picked' + t;
    const hk = hostKind();
    const saved = D.project.updated_at ? ' saved ' + when(D.project.updated_at) : '';
    return hk === 'A' ? 'Waiting for the board database' + (SRC.ok === false ? ' (not signed in?); showing the copy in this page' : '') : 'Snapshot' + saved + ' in this page · ' + (hk === 'C' ? 'refreshes when akuko saves' : 'load akuko.json to refresh');
  }
  function renderFoot() {
    let man = {};
    try { man = JSON.parse($('#ikenga-manifest').textContent); } catch (e) { man = {}; }
    const kind = W.store(), ok = store.ok && W.stored();
    const saveTxt = kind === 'artifact-db' ? 'Your decisions are saved to this board’s database.' + (ok ? '' : ' This browser blocks local storage, so nothing else is kept here.')
      : kind === 'ikenga' ? 'Your decisions reach akuko on its next action.' + (ok ? '' : ' This browser blocks storage; a reload would lose them.')
      : (ok ? 'Your decisions are saved in this browser. Copy them to akuko when you are done.' : 'Not saved: this browser blocks storage, so changes last until you close the page. Copy them to akuko before you leave.');

    const sb = $('#sample-bar');
    if (sb) {
      sb.hidden = !isSample();
      sb.textContent = !isSample() ? '' : 'Sample project: ' + D.project.title + '. ' + (hostKind() === 'A' ? 'Your own project appears here once akuko has saved it to this board’s database.' : 'Use “Load akuko.json” at the bottom of the page to see your film. Approve and note buttons are off until then.');
    }
    const wb = $('#store-warn');
    if (wb) { wb.hidden = ok; wb.textContent = ok ? '' : (kind === 'outbox' ? 'This browser blocks storage, so your decisions are not saved here. Copy them to akuko before you close the page.' : 'This browser blocks storage. Your decisions still reach ' + (kind === 'artifact-db' ? 'the board database' : 'Ikenga') + ', but a reload would lose this page’s copy.'); }
    $('#foot').innerHTML = '<span class="' + (ok ? '' : 'foot-warn') + '" id="save-note">' + esc(saveTxt) + '</span>' +
      '<span id="src-note">' + esc(srcText()) + '</span>' +
      '<span class="mono">' + esc(D.project.slug) + ' · schema ' + esc(D.schema_version) + ' · ' + esc(man.name || '') + ' ' + esc(man.version || '') + '</span><span class="sp"></span>' +
      (kind === 'outbox' ? '<button class="linkbtn" type="button" data-act="export" data-akuko-export data-k="export">Copy decisions for akuko (' + W.all().length + ')</button>' : '') +
      (hostKind() !== 'A' ? '<button class="linkbtn" type="button" data-act="load" data-k="load">Load akuko.json</button>' : '');
    if (fk) { const el = document.querySelector('#foot [data-k="' + fk + '"]'); if (el) el.focus({ preventScroll: true }); }
  }

  /* ── render + focus continuity ────────────────────────── */
  function renderAll(fallbackFocus) {
    derive();
    const ae = document.activeElement;
    const k = ae && ae.dataset ? ae.dataset.k : null;
    const typing = ae && ae.id === 'compose-text' ? { s: ae.selectionStart, e: ae.selectionEnd } : null;
    document.documentElement.setAttribute('data-akuko-mode', S.mode);
    renderHeader(); renderNext(); renderStages(); renderNav();
    paintScript(); renderShots(); renderGate(); renderBible(); renderLedger(); renderFoot();
    if (typing) {
      const ta = $('#compose-text');
      if (ta) { ta.focus({ preventScroll: true }); try { ta.setSelectionRange(typing.s, typing.e); } catch (e) { /* ignore */ } }
    } else {
      const want = k || fallbackFocus;
      if (want && (!ae || !document.body.contains(ae) || ae === document.body || k)) {
        const el = document.querySelector('[data-k="' + want.replace(/"/g, '\\"') + '"]');
        if (el && el !== ae) el.focus({ preventScroll: true });
        else if (!el && fallbackFocus) { const fb = document.querySelector('[data-k="' + fallbackFocus + '"]'); if (fb) fb.focus({ preventScroll: true }); }
      }
    }
    requestAnimationFrame(layoutLining);
    syncStuck();
  }
  function commit(fallbackFocus) { save(); renderAll(fallbackFocus); }
  let renderQueued = false;
  function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; renderAll(); }); }

  function scrollParent(el) {
    for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      const o = getComputedStyle(p).overflowY;
      if ((o === 'auto' || o === 'scroll') && p.scrollHeight > p.clientHeight) return p;
    }
    return null;
  }
  function reveal(el, block) {
    if (!el) return;
    const sc = scrollParent(el);
    const scrolls = !!sc;
    const r = el.getBoundingClientRect();
    const box = scrolls ? sc.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
    const topPad = scrolls ? 64 : (isMobile() ? 130 : 16);
    if (r.top >= box.top + topPad && r.bottom <= box.bottom - 12) return;
    el.scrollIntoView({ block: block || 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  function pulseLine(id) {
    const ln = document.getElementById('ln-' + id);
    if (!ln) return;
    ln.classList.remove('pulse'); void ln.offsetWidth; ln.classList.add('pulse');
  }

  /* ── actions ──────────────────────────────────────────── */
  function selectShot(id, from, opts) {
    if (!shotsById[id]) return;
    const toggle = from === 'row' && S.sel === id;
    S.sel = toggle ? null : id;
    if (!S.compose || S.compose.id !== S.sel) S.compose = null;
    if (!S.flash || S.flash.id !== S.sel) S.flash = null;
    if (!isWide() && !(isMobile() && from === 'toscript')) {
      if (isMobile() ? (from !== 'row') : (S.view !== 'script' && S.view !== 'shots')) S.view = 'shots';
    }
    save();
    renderAll((opts && opts.focus) || null);
    if (toggle) return;
    requestAnimationFrame(() => {
      const row = $('#shot-' + id + ' .shot-row');
      if (from !== 'row') reveal(row, 'start');
      if (from === 'row' && row) reveal(row, 'nearest');
      if (isWide() || (!isMobile())) reveal(document.getElementById('ln-' + id), 'center');
    });
  }
  function openGate() {
    if (!isWide()) S.view = 'spend';
    save(); renderAll();
    requestAnimationFrame(() => { const h = $('#h-spend'); if (h) { reveal(h, 'start'); h.focus({ preventScroll: true }); } });
  }
  function openBible(bid) {
    S.rail = 'bible';
    if (!isWide()) S.view = 'bible';
    save(); renderAll();
    requestAnimationFrame(() => {
      const el = document.getElementById('bib-' + bid);
      if (!el) return;
      el.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      el.focus({ preventScroll: true });
    });
  }
  function firstWaitingBible() {
    const a = pendingAssets()[0];
    if (a) { const o = Object.keys(bibleById).find(k => bibleById[k].item.assets.some(x => x.id === a.id)); return o || a.id; }
    const e = pendingEntries()[0];
    return e ? e.id : '';
  }
  function submitCompose(form) {
    const id = form.dataset.id, ta = $('#compose-text', form), text = ta.value.trim();
    if (!S.compose) return;
    if (!text) {
      $('#compose-err', form).textContent = S.compose.mode === 'request' ? 'Say what should change, so akuko can act on it.' : 'Write the note first.';
      ta.setAttribute('aria-invalid', 'true'); ta.focus(); return;
    }
    let d;
    if (S.compose.mode === 'request') { d = decide({ action: 'request-changes', unit: id, stage: stageOf(id), text: text }); S.flash = { id: id, did: d.id, text: 'Sent back to akuko with your note.' }; announce(id + ' sent back to akuko'); }
    else { d = decide({ action: 'note', unit: id, stage: stageOf(id), text: text }); S.flash = { id: id, did: d.id, text: 'Note added to the thread.' }; announce('Note added to ' + id); }
    S.compose = null;
    commit('approve:' + id);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) {
      const ln = e.target.closest('#page .ln');
      if (ln) selectShot(ln.dataset.shot, 'script');
      return;
    }
    const a = t.dataset.act, id = t.dataset.id;
    if (t.getAttribute('aria-disabled') === 'true') return;
    if (isSample() && t.hasAttribute('data-akuko-action')) { announce('This is a sample project. Decisions start working once the board can read your project.'); return; }
    switch (a) {
      case 'sel': selectShot(id, 'row'); break;
      case 'sel-tag': selectShot(id, 'script', { focus: 'tag:' + id }); break;
      case 'sel-unit': case 'goto': selectShot(id, 'gate', { focus: 'sel:' + id }); break;
      case 'approve': {
        const d = decide({ action: 'approve', unit: id, stage: stageOf(id) });
        S.compose = null; S.flash = { id: id, did: d.id, text: 'Approved. akuko picks this up on its next action.' };
        announce(id + ' approved'); commit('approve:' + id); break;
      }
      case 'request': case 'note':
        S.compose = { id: id, mode: a, text: (S.compose && S.compose.id === id && S.compose.mode === a) ? S.compose.text : '' };
        S.flash = null; renderAll();
        requestAnimationFrame(() => { const ta = $('#compose-text'); if (ta) ta.focus(); });
        break;
      case 'c-cancel': S.compose = null; renderAll((S.sel ? 'approve:' + S.sel : null)); break;
      case 'undo': {
        const tg = undoTarget(id, ['approve', 'request-changes']); if (!tg) return;
        decide({ action: 'undo', unit: id, stage: stageOf(id), undoes: tg.id });
        S.flash = null;
        announce('Undone. ' + id + ' goes back to how it was'); commit('approve:' + id); break;
      }
      case 'next': {
        const n = nextPending(S.sel);
        if (n) selectShot(n, 'gate', { focus: 'sel:' + n });
        else if (S.sel && shotStatus(S.sel) === 'pending-review') selectShot(S.sel, 'gate', { focus: 'sel:' + S.sel });
        else if (awaitingSpend().length) openGate();
        else if (waitingOther()) openBible(firstWaitingBible());
        break;
      }
      case 'toscript': {
        if (isMobile()) { S.view = 'script'; save(); renderAll(); }
        requestAnimationFrame(() => requestAnimationFrame(() => {
          layoutLining();
          const ln = document.getElementById('ln-' + id);
          if (ln) { ln.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); pulseLine(id); }
          const tag = $('.tag[data-id="' + id + '"]'); if (tag) tag.focus({ preventScroll: true });
        }));
        break;
      }
      case 'ref': openBible(id); break;
      case 'filter': S.filter = id; commit('filter:' + id); break;
      case 'view': {
        S.view = id; save(); renderAll('view:' + id);
        if (isMobile()) { const nav = $('#desknav'); const y = nav.getBoundingClientRect().top + window.scrollY; if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'auto' }); }
        if (id === 'shots') requestAnimationFrame(() => { if (S.sel) reveal($('#shot-' + S.sel + ' .shot-row'), 'start'); });
        if (id === 'script') requestAnimationFrame(() => { layoutLining(); });
        break;
      }
      case 'rail': S.rail = id; commit('rail:' + id); break;
      case 'stage': if (id === 'spend') openGate(); else if (id === 'bible') openBible(firstWaitingBible()); else { if (!isWide()) S.view = 'shots'; save(); renderAll(); requestAnimationFrame(() => { const h = $('#h-shots'); if (h) reveal(h, 'start'); }); } break;
      case 'spend-ok': {
        const j = D.pending_spend.find(x => x.id === id); if (!j) return;
        decide({ action: 'approve-spend', unit: id, stage: j.stage, text: 'approve ' + gateNum(bound(j)) + ' ' + ((D.budget && D.budget.currency) || 'USD') });
        announce('Spend approved: ' + money(bound(j)) + ' for ' + j.label); commit('spend-undo:' + id); break;
      }
      case 'spend-no': { const j = D.pending_spend.find(x => x.id === id); if (j) decide({ action: 'decline-spend', unit: id, stage: j.stage }); announce('Spend declined for now'); commit('spend-undo:' + id); break; }
      case 'spend-undo': {
        const j = D.pending_spend.find(x => x.id === id), tg = j && undoTarget(id, ['approve-spend', 'decline-spend']); if (!tg) return;
        decide({ action: 'undo', unit: id, stage: j.stage, undoes: tg.id });
        announce('Spend is waiting for your decision again'); commit('spend-ok:' + id); break;
      }
      case 'unit-ok': {
        decide({ action: 'approve', unit: id, stage: stageOf(id) });
        announce('Approved'); commit('unit-undo:' + t.dataset.k.slice('unit-ok:'.length)); break;
      }
      case 'unit-undo': {
        const tg = undoTarget(id, ['approve']); if (!tg) return;
        decide({ action: 'undo', unit: id, stage: stageOf(id), undoes: tg.id });
        announce('Undone'); commit('unit-ok:' + t.dataset.k.slice('unit-undo:'.length)); break;
      }
      case 'mode': S.mode = S.mode === 'dark' ? 'light' : 'dark'; S.modeChosen = true; commit('mode'); break;
      case 'export': try { navigator.clipboard.writeText(W.jsonl()); announce('Decisions copied. Paste them to akuko.'); } catch (err) { announce('Copy failed'); } break;
      case 'gate-top': { const rl = $('#rail'); if (rl) rl.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); const hh = $('#h-spend'); if (hh) hh.focus({ preventScroll: true }); break; }
      case 'load': { const fi = $('#file-in'); if (fi) fi.click(); break; }
    }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form="compose"]');
    if (!f) return;
    e.preventDefault(); submitCompose(f);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'compose-text' && S.compose) {
      S.compose.text = e.target.value;
      if (e.target.value.trim()) { e.target.removeAttribute('aria-invalid'); const er = $('#compose-err'); if (er) er.textContent = ''; }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'compose-text') {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitCompose(e.target.form); return; }
      if (e.key === 'Escape') { e.preventDefault(); const id = S.compose && S.compose.id; S.compose = null; renderAll(id ? 'approve:' + id : null); return; }
    }
    if (e.target.getAttribute && e.target.getAttribute('role') === 'tab' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home' || e.key === 'End')) {
      e.preventDefault();
      const tabs = $$('#rail-tabs [role="tab"]'), i = tabs.indexOf(e.target);
      const n = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      S.rail = tabs[n].dataset.id; commit('rail:' + S.rail);
    }
  });

  /* linked hover: script line <-> tramline <-> shot row */
  let hoverId = null;
  function paintHover() {
    $$('.is-hint').forEach(el => el.classList.remove('is-hint'));
    if (!hoverId) return;
    const ln = document.getElementById('ln-' + hoverId); if (ln) ln.classList.add('is-hint');
    $$('#lining [data-id="' + hoverId + '"]').forEach(el => el.classList.add('is-hint'));
    const row = $('#shot-' + hoverId + ' > .shot-row'); if (row) row.classList.add('is-hint');
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest ? e.target.closest('[data-hover]') : null;
    const id = el ? el.dataset.hover : null;
    if (id !== hoverId) { hoverId = id; paintHover(); }
  });

  /* ── live data: reads only, so the board never needs republishing ──
     A  the board's artifact database: doc akuko/project, collection decisions
     B  akuko.json beside the page (when the page is served), or a file you pick
     C  the same, through the Ikenga viewer
     A newer project replaces the page's embedded snapshot; the page never writes it. */
  function ingestProject(p, kind) {
    SRC.ok = true;
    if (!isProject(p) || !p.project || (!isSample() && p.project.slug !== P.project.slug)) return;
    SRC.kind = kind; SRC.at = new Date();
    const sig = JSON.stringify(p);
    if (sig === lastSig && !isSample()) { renderFoot(); return; }
    lastSig = sig;
    setProject(p);
    if (S.sel && !shotsById[S.sel]) { S.sel = null; S.compose = null; S.flash = null; }
    if (!S.sel) { const f = D.shots.find(s => s.status === 'pending-review'); S.sel = (f || D.shots[0] || { id: null }).id; }
    buildScript();
    renderAll();
  }
  function ingestRows(rows) {
    const next = rows.filter(validDecision);
    const sig = next.map(d => d.id).sort().join(',');
    if (sig === remote.map(d => d.id).sort().join(',')) return;
    remote = next;
    scheduleRender();
  }
  const snapData = s => { if (!s) return null; const ex = typeof s.exists === 'function' ? s.exists() : s.exists; if (ex === false) return null; const d = typeof s.data === 'function' ? s.data() : s.data; return d || null; };
  function rowsFrom(qs) {
    const out = [];
    const each = qs && (qs.docs || null);
    const push = d => { const v = typeof d.data === 'function' ? d.data() : d.data; if (v && v.action) out.push(v); else if (v && v.data && v.data.action) out.push(v.data); else if (d && d.action) out.push(d); };
    if (Array.isArray(each)) each.forEach(push); else if (qs && typeof qs.forEach === 'function') qs.forEach(push);
    return out;
  }
  function watchDb() {
    window.claude.use('db').then(db => {
      if (!db) { SRC.ok = false; renderFoot(); return; }
      const pdoc = db.doc('akuko/project'), dcol = db.collection('decisions');
      const takeP = s => { const d = snapData(s); if (d) ingestProject(d, 'artifact-db'); };
      const takeD = qs => ingestRows(rowsFrom(qs));
      const pull = () => {
        if (document.hidden) return;
        try { pdoc.get().then(takeP, () => {}); } catch (e) { /* offline */ }
        try { dcol.get().then(takeD, () => {}); } catch (e) { /* offline */ }
      };
      try { if (typeof pdoc.onSnapshot === 'function') pdoc.onSnapshot(takeP, () => {}); } catch (e) { /* poll instead */ }
      try { if (typeof dcol.onSnapshot === 'function') dcol.onSnapshot(takeD, () => {}); } catch (e) { /* poll instead */ }
      pull();
      setInterval(pull, 20000);
    }).catch(() => { SRC.ok = false; });
    window.claude.use('user').then(u => { if (u && typeof u.id === 'function') return u.id().then(id => { if (id) { myId = id; scheduleRender(); } }); }).catch(() => {});
  }
  function watchFile() {
    if (typeof fetch !== 'function' || location.protocol === 'file:') return; // a file page can't read its neighbours: use Load akuko.json
    const urls = ['akuko.json', '../akuko.json'];
    let at = 0;
    const pull = () => {
      if (document.hidden) return;
      const url = urls[at % urls.length];
      fetch(url, { cache: 'no-store' }).then(r => (r && r.ok ? r.json() : null)).then(p => { if (p && isProject(p)) ingestProject(p, 'file'); else at++; }).catch(() => { at++; });
    };
    pull();
    setInterval(pull, 15000);
  }
  document.addEventListener('change', e => {
    if (e.target.id !== 'file-in') return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { ingestProject(JSON.parse(String(rd.result)), 'picked'); announce('Loaded ' + f.name); } catch (err) { announce('That file is not an akuko.json'); } e.target.value = ''; };
    rd.readAsText(f);
  });

  /* ── boot ─────────────────────────────────────────────── */
  if (!S.sel) { const p0 = D.shots.find(s => s.status === 'pending-review'); S.sel = (p0 || D.shots[0] || { id: null }).id; }
  buildScript();
  renderAll();
  W.onChange(scheduleRender);
  { const rail = $('#rail'); if (rail) rail.addEventListener('scroll', syncStuck, { passive: true }); }
  if (window.MutationObserver) {
    new MutationObserver(() => { const m = hostMode(); if (m && !S.modeChosen && m !== S.mode) { S.mode = m; renderAll(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode'] });
  }
  if (window.claude && typeof window.claude.use === 'function') watchDb(); else watchFile();
  const relayout = () => requestAnimationFrame(layoutLining);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe($('#paper'));
  window.addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout).catch(() => {});
  const onMq = () => { renderNav(); relayout(); };
  [mqMobile, mqWide].forEach(mq => { if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); });
  window.addEventListener('load', () => { renderHeader(); relayout(); });
  requestAnimationFrame(() => {
    layoutLining();
    if (S.sel && !isMobile()) {
      const row = $('#shot-' + S.sel + ' .shot-row');
      if (row) row.scrollIntoView({ block: 'start' });
      const ln = document.getElementById('ln-' + S.sel);
      if (ln) { const sc = $('#script-scroll'); if (sc) sc.scrollTop = Math.max(0, ln.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 3); }
      window.scrollTo(0, 0);
    }
  });
})();
</script>
</body>
