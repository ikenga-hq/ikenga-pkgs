<!--
akuko default board · default-board@0.6 · built from the locked design D-01 (option B, "Script desk")
  What it is: the one finished review surface akuko ships. Script paper on the left, the shot list beside it with every shot lined to the
    line it came from, the spend gate pinned top-right, Bible and Ledger beneath it. It is a view in the sense of views/contract.md:
    it shows akuko.json and writes decisions through the inlined decision writer, nothing else.
  Live data: the <script id="akuko-project"> block is a snapshot the publisher writes. On claude.ai the page reads the live doc
    akuko/project and the decisions collection from the artifact database; as a local file it reads akuko.json beside it (or a file
    you pick); in Ikenga it reads the same file through the viewer. It only ever reads these: it never writes the project and never
    needs republishing to show new state. A decision the project has not folded in yet is shown as a preview, derived again on every render.
  Real projects (WP-29, @0.3): a part filter and a one-part view (#part=P7) for a 211-shot shot list, film times on the master clock,
    cards as review items (approved once), a read-only Rules panel and a Gates panel (scope progress, who signed and how). The board
    never signs a gate: a sign-off is recorded by decisions/cli.ts signoff, on the signer's word.
  Idle motion units (WP-32, @0.4): a clip, lip-sync or line cut whose shot no longer asks for it (the person changed its
  treatment) is kept and shown as idle, and is left out of "your move" like a removed row (motion/stage.ts#isIdleMotionUnit);
  an approved paid job whose units are all idle shows as idle, not as queued work.
  Pictures and stages (@0.5): bible images, key frames, cards and intake documents are shown (thumbnail, then larger in a
    dialog) where the project has a file: an artifact /_blob/ path, a thumbnail the publisher embedded (project._board), or a
    project-relative path the publisher resolved; never a remote or absolute URL. Each pipeline stage opens a lens on what it
    holds; intake documents sit with the script; per-stage status uses that stage's decisions only; "Review next shot" starts
    from the first waiting shot in film order; once the current stage has nothing waiting the "your move" line offers a
    sentence to paste into chat.
  Note labels (@0.6): a person's note on a shot is labelled "Note on the shot", not with the shot's stage. A shot keeps its
    stage (sketch) while the film moves on, so a stage label read as if the note had been written at the sketch board.
  Provenance: this exact file's sha256 is on views/conformed.json. Change it, bump "version", run scripts/check-view.mjs --ship again.
  Tokens: @ikenga/tokens theme A "Dusk Wood" values, defined under --ak-* names on purpose: a host that injects its own --bg-base / --fg
    (the Ikenga viewer does) must not be able to mix its palette into this page.
-->

<style>
/* ── tokens: @ikenga/tokens theme A "Dusk Wood" (design-contract.json) ── */
:root {
  --ak-font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --ak-font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --ak-font-display: 'Fraunces', ui-serif, Georgia, serif;
  --ak-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ak-space-1: 4px; --ak-space-2: 8px; --ak-space-3: 12px; --ak-space-4: 16px; --ak-space-5: 20px; --ak-space-6: 24px; --ak-space-8: 32px; --ak-space-10: 40px;
  --ak-radius-xs: 3px; --ak-radius-sm: 4px; --ak-radius-md: 6px; --ak-radius-lg: 10px; --ak-radius-xl: 14px; --ak-radius-pill: 999px;

}

  --ak-bg-base: hsl(28,18%,4%);

  --ak-bg-raised: hsl(28,11%,11%);
  --ak-bg-sunken: hsl(28,22%,2.5%);
  --ak-fg: hsl(36,28%,90%);
  --ak-fg-muted: hsl(32,11%,56%);
  --ak-fg-faint: hsl(28,9%,36%);
  --ak-border: hsl(28,14%,15%);
  --ak-border-soft: hsl(28,14%,11%);
  --ak-primary: hsl(20,50%,34%);
  --ak-primary-fg: hsl(36,30%,92%);
  --ak-primary-soft: hsl(20,40%,14%);
  --ak-achievement: hsl(42,78%,54%);
  --ak-achievement-soft: hsl(42,48%,18%);
  --ak-kola-amber: hsl(42,78%,50%);
  --ak-danger: hsl(8,68%,46%);
  --ak-danger-fg: hsl(0,0%,98%);
  --ak-danger-soft: hsl(8,50%,16%);
  --ak-info: hsl(200,66%,64%);
  --ak-info-soft: hsl(200,42%,15%);
  --ak-success: hsl(142,70%,50%);
  --ak-warning: hsl(38,92%,60%);
  --ak-shadow-1: 0 1px 2px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.25);
  --ak-shadow-2: 0 4px 12px -2px rgba(0,0,0,.55);
  --ak-shadow-3: 0 12px 28px -8px rgba(0,0,0,.6);
  /* role aliases (re-weighting only, no new hues) */
  --ak-desk: var(--ak-bg-sunken);
  --ak-paper: var(--ak-bg-surface);
  --ak-attn-fg: var(--ak-achievement);
  --ak-money-fg: var(--ak-achievement);
  --ak-money-bg: transparent;
  --ak-money-pad: 0;
}
:root[data-akuko-mode="light"] {
  color-scheme: light;
  --ak-bg-base: hsl(36,22%,96%);
  --ak-bg-surface: hsl(36,18%,93%);
  --ak-bg-raised: hsl(36,14%,89%);
  --ak-bg-sunken: hsl(36,26%,98%);
  --ak-fg: hsl(28,30%,14%);
  --ak-fg-muted: hsl(28,14%,38%);
  --ak-fg-faint: hsl(28,12%,56%);
  --ak-border: hsl(32,16%,78%);
  --ak-border-soft: hsl(32,16%,84%);
  --ak-primary: hsl(20,50%,34%);
  --ak-primary-fg: hsl(36,26%,98%);
  --ak-primary-soft: hsl(20,50%,90%);
  --ak-achievement: hsl(42,78%,42%);
  --ak-achievement-soft: hsl(42,60%,90%);
  --ak-kola-amber: hsl(42,78%,50%);
  --ak-danger: hsl(8,68%,42%);
  --ak-danger-fg: hsl(0,0%,98%);
  --ak-danger-soft: hsl(8,60%,92%);
  --ak-info: hsl(200,74%,36%);
  --ak-info-soft: hsl(200,50%,90%);
  --ak-success: hsl(142,65%,38%);
  --ak-warning: hsl(38,88%,48%);
  --ak-shadow-1: 0 1px 2px rgba(28,18,8,.08);
  --ak-shadow-2: 0 4px 12px -2px rgba(28,18,8,.10);
  --ak-shadow-3: 0 12px 28px -8px rgba(28,18,8,.14);
  --ak-desk: var(--ak-bg-surface);
  --ak-paper: var(--ak-bg-sunken);
  --ak-attn-fg: var(--ak-fg);
  --ak-money-fg: var(--ak-fg);
  --ak-money-bg: var(--ak-achievement-soft);
  --ak-money-pad: 0 4px;
}

/* ── base ── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ak-bg-base); color: var(--ak-fg);
  font: 400 14px/1.55 var(--ak-font-body);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4, p, ol, ul, dl, dd, figure, blockquote, pre { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ak-info); outline-offset: 2px; }
.mono { font-family: var(--ak-font-mono); font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; max-width: min(92vw, 560px); margin: 0; padding: 10px 16px; border-radius: var(--ak-radius-md); background: var(--ak-fg); color: var(--ak-bg-base); font: 600 14px/1.35 var(--ak-font-sans); box-shadow: var(--ak-shadow-3); }
.toast[hidden], .copy-fallback[hidden] { display: none; }
.copy-fallback { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 60; width: min(92vw, 560px); padding: 10px 12px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); background: var(--ak-bg-surface); color: var(--ak-fg); font: 400 14px/1.4 var(--ak-font-mono); }
.vh { position: absolute !important; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
body, .pane, .rail, .rail-panel, .scroller, .shot, .bib, .ledger, .dn, .rtab, .ref { position: relative; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; padding: 10px 14px; background: var(--ak-primary); color: var(--ak-primary-fg); border-radius: var(--ak-radius-md); font: 600 14px/1 var(--ak-font-sans); text-decoration: none; }
.skip:focus { top: 8px; }
.money { color: var(--ak-money-fg); background: var(--ak-money-bg); padding: var(--ak-money-pad); border-radius: var(--ak-radius-xs); font-family: var(--ak-font-mono); font-variant-numeric: tabular-nums; }
.fine { font-size: 12px; line-height: 1.5; color: var(--ak-fg-muted); }
.empty { padding: 20px; color: var(--ak-fg-muted); }

/* status glyphs: shape + colour, never colour alone */
.g { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; }
.g-ok { background: var(--ak-success); }
.g-wait { border: 2px solid var(--ak-achievement); }
.g-rework { width: 7px; height: 7px; border-radius: 1px; background: var(--ak-danger); transform: rotate(45deg); }
.g-none { border: 1.5px dashed var(--ak-fg-muted); }
.g-prog { background: var(--ak-info); }
.g-now { background: var(--ak-primary); box-shadow: 0 0 0 2px var(--ak-primary-soft), 0 0 0 3px var(--ak-primary); }
.g-money { border-radius: 1px; background: var(--ak-kola-amber); }
.ico { width: 14px; height: 14px; flex: none; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 9px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill);
  font: 600 12px/1 var(--ak-font-sans); color: var(--ak-fg); white-space: nowrap;
}
.chip[data-st="approved"] { color: var(--ak-fg-muted); }
.chip[data-st="pending-review"] { background: var(--ak-achievement-soft); border-color: transparent; }
.chip[data-st="needs-rework"] { background: var(--ak-danger-soft); border-color: transparent; }
.chip[data-st="not-started"] { color: var(--ak-fg-muted); border-style: dashed; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 14px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md);
  background: var(--ak-bg-raised); color: var(--ak-fg); font: 600 14px/1.1 var(--ak-font-sans); white-space: nowrap;
}
.btn:hover { border-color: var(--ak-fg-muted); }
.btn-primary { background: var(--ak-primary); border-color: var(--ak-primary); color: var(--ak-primary-fg); }
.btn-primary:hover { background: color-mix(in srgb, var(--ak-primary) 86%, var(--ak-fg)); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn[aria-disabled="true"] { opacity: .55; cursor: default; }
.btn[aria-disabled="true"]:hover { border-color: var(--ak-border); }
.btn-primary[aria-disabled="true"]:hover { background: var(--ak-primary); border-color: var(--ak-primary); }
.linkbtn { font: 600 13px/1.3 var(--ak-font-sans); text-decoration: underline; text-underline-offset: 3px; color: var(--ak-fg); padding: 4px 2px; }

/* ── header ── */
.top { background: var(--ak-bg-surface); border-bottom: 1px solid var(--ak-border); }
.top-row { display: flex; align-items: center; gap: 20px; padding: 12px 20px; }
.ident { flex: none; display: grid; gap: 1px; }
.eyebrow { font: 600 12px/1.2 var(--ak-font-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ak-fg-muted); }
.title { font: 500 26px/1.1 var(--ak-font-display); font-variation-settings: "opsz" 96; letter-spacing: -.01em; }
.meta { font-size: 12px; color: var(--ak-fg-muted); }
.next { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding-left: 20px; border-left: 1px solid var(--ak-border); }
.next-txt { min-width: 0; }
.next-main { font: 500 16px/1.3 var(--ak-font-sans); }
.next-main strong { font-weight: 700; color: var(--ak-attn-fg); }
.next-sub { font: 500 13px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); margin-top: 2px; }
.host {
  flex: 0 1 330px; display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 8px 12px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md);
  font: 500 12.5px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted);
}
.host b { color: var(--ak-fg); font-weight: 700; }
.hdot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ak-fg-muted); flex: none; }
.host[data-live="1"] .hdot { background: var(--ak-success); border-color: var(--ak-success); }
.mode-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); font: 600 13px/1 var(--ak-font-sans); }
.mode-btn:hover { border-color: var(--ak-fg-muted); }

/* pipeline: nine slate cells */
.pipeline ol { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); border-top: 1px solid var(--ak-border-soft); }
.stage { position: relative; min-width: 0; border-right: 1px solid var(--ak-border-soft); }
.stage:last-child { border-right: 0; }
.stage-in { display: grid; align-content: start; gap: 3px; width: 100%; height: 100%; padding: 8px 12px 9px; text-align: left; }
button.stage-in { cursor: pointer; }
button.stage-in:hover { background: var(--ak-bg-raised); }
.stage-idle { cursor: default; }
.st-top { display: flex; align-items: baseline; gap: 7px; font: 600 13px/1.25 var(--ak-font-sans); }
.st-n { font: 500 12px/1 var(--ak-font-mono); color: var(--ak-fg-muted); }
.st-s { display: flex; align-items: center; gap: 6px; font: 500 12px/1.3 var(--ak-font-sans); color: var(--ak-fg-muted); }
.stage[aria-current="step"] { background: var(--ak-primary-soft); }
.stage[aria-current="step"]::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--ak-primary); }
.stage[aria-current="step"] .st-s { color: var(--ak-fg); }
.stage[data-state="locked"] .st-top { color: var(--ak-fg-muted); }
.stage[data-state="waiting-spend"] .st-s { color: var(--ak-fg); }

/* ── desk ── */
.desk { display: grid; min-width: 0; }
.desk-nav { display: flex; gap: 4px; padding: 8px 12px; background: var(--ak-bg-surface); border-bottom: 1px solid var(--ak-border); }
.dn { flex: 1 1 0; min-width: 0; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--ak-radius-md); font: 600 13px/1 var(--ak-font-sans); color: var(--ak-fg-muted); }
.dn:hover { color: var(--ak-fg); }
.dn[aria-pressed="true"] { background: var(--ak-bg-raised); color: var(--ak-fg); box-shadow: inset 0 -2px 0 var(--ak-primary); }
.badge { display: inline-block; min-width: 20px; padding: 3px 6px; border-radius: var(--ak-radius-pill); background: var(--ak-achievement-soft); color: var(--ak-fg); font: 600 12px/1 var(--ak-font-mono); text-align: center; }

.pane, .rail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-script { background: var(--ak-desk); border-right: 1px solid var(--ak-border); }
.pane-shots { background: var(--ak-bg-base); border-right: 1px solid var(--ak-border); }
.rail { background: var(--ak-bg-surface); }
.pane-head { flex: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 14px 20px 12px; border-bottom: 1px solid var(--ak-border-soft); }
.ph-h { font: 500 20px/1.2 var(--ak-font-display); }
.ph-sub { font: 500 13px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; width: 100%; font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .lt { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--ak-fg-muted); }
.legend .lt-wait { border-color: var(--ak-achievement); }
.legend .lt-rework { border-color: var(--ak-danger); }
.legend .lt-sel { border-top-width: 4px; border-color: var(--ak-primary); }
.scroller { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* ── script paper ── */
.paper-wrap { padding: 20px; }
.paper {
  position: relative; max-width: 760px; margin: 0 auto;
  padding: 36px var(--ak-lining-w) 56px 32px;
  background: var(--ak-paper); border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-xs); box-shadow: var(--ak-shadow-2);
  font: 400 14px/1.7 var(--ak-font-mono); color: var(--ak-fg);
}
.page-head { text-align: center; margin-bottom: 8px; }
.pg-title { font-weight: 600; letter-spacing: .1em; text-decoration: underline; text-underline-offset: 5px; }
.pg-src { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--ak-fg-muted); }
.scene { margin-top: 30px; }
.slug { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.5ch; font: 600 14px/1.55 var(--ak-font-mono); text-transform: uppercase; }
.slug .sn { color: var(--ak-fg-muted); font-weight: 500; }
.action { margin-top: 12px; }
.cue { margin: 16px 0 0 12ch; text-transform: uppercase; }
.dlg { margin-left: 6ch; max-width: 34ch; }
.dlg + .dlg { margin-top: 12px; }
.ln { cursor: pointer; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; scroll-margin: 80px; }
.ln.is-hint { background: var(--ak-bg-raised); }
.ln.is-sel { background: var(--ak-primary-soft); box-shadow: 0 0 0 2px var(--ak-primary-soft); }
.ln.is-sel .ln { background: transparent; box-shadow: none; }
.lining { position: absolute; top: 0; right: 0; bottom: 0; width: var(--ak-lining-w); pointer-events: none; }
.lining::before { content: ""; position: absolute; left: 0; top: 28px; bottom: 28px; border-left: 1px dashed var(--ak-border); }
.tram { position: absolute; width: 2px; border-radius: 1px; background: var(--ak-fg-muted); }
.tram::before, .tram::after { content: ""; position: absolute; left: -3px; width: 8px; height: 2px; background: inherit; }
.tram::before { top: 0; }
.tram::after { bottom: 0; }
.tram[data-st="pending-review"] { background: var(--ak-achievement); }
.tram[data-st="needs-rework"] { background: var(--ak-danger); }
.tram.is-hint { background: var(--ak-fg); }
.tram.is-sel { background: var(--ak-primary); width: 4px; margin-left: -1px; }
.tag {
  position: absolute; top: 0; left: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px;
  background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs);
  font: 500 12px/1 var(--ak-font-mono); color: var(--ak-fg); white-space: nowrap;
}
.tag:hover, .tag.is-hint { border-color: var(--ak-fg-muted); }
.tag.is-sel { background: var(--ak-primary); border-color: var(--ak-primary); color: var(--ak-primary-fg); }

/* ── shots ── */
.filters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill); font: 600 12px/1 var(--ak-font-sans); color: var(--ak-fg-muted); }
.fchip:hover { color: var(--ak-fg); }
.fchip[aria-pressed="true"] { background: var(--ak-bg-raised); color: var(--ak-fg); border-color: var(--ak-fg-muted); }
.banner { position: sticky; top: 0; z-index: 2; display: grid; gap: 3px; padding: 12px 20px 10px; background: var(--ak-bg-base); border-bottom: 1px solid var(--ak-border-soft); }
.banner h3 { display: flex; align-items: baseline; gap: 10px; font: 600 13px/1.35 var(--ak-font-sans); letter-spacing: .04em; text-transform: uppercase; }
.bn-n { flex: none; padding: 2px 6px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); font: 600 12px/1.2 var(--ak-font-mono); letter-spacing: 0; }
.bn-m { font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.shot { border-bottom: 1px solid var(--ak-border-soft); }
.shot-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 10px 20px; scroll-margin-top: 72px; }
.shot-row:hover, .shot-row.is-hint { background: var(--ak-bg-surface); }
.shot.is-sel > .shot-row { background: var(--ak-primary-soft); }
.thumb { display: block; width: 112px; aspect-ratio: 16 / 9; }
.thumb svg { display: block; width: 100%; height: 100%; }
.sr-main { min-width: 0; display: grid; gap: 3px; }
.sr-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.sr-id { font: 600 13px/1.3 var(--ak-font-mono); }
.sr-type { font: 700 12px/1.3 var(--ak-font-sans); letter-spacing: .08em; color: var(--ak-fg-muted); }
.sr-tc { font: 400 12px/1.3 var(--ak-font-mono); color: var(--ak-fg-muted); }
.sr-act { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* detail */
.detail { padding: 4px 20px 26px; background: var(--ak-bg-surface); border-top: 1px solid var(--ak-border-soft); }
.panel-big { margin-top: 12px; }
.panel-big svg { display: block; width: 100%; height: auto; border-radius: var(--ak-radius-sm); }
.panel-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 6px; font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.review { margin-top: 10px; padding: 14px; background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); }
.rv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rv-msg { flex: 1 1 220px; font-size: 14px; color: var(--ak-fg); }
.rv-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.composer { margin-top: 12px; }
.lbl { display: block; font: 600 13px/1.4 var(--ak-font-sans); margin-bottom: 6px; }
.composer textarea { display: block; width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; background: var(--ak-bg-base); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-sm); font: 400 14px/1.5 var(--ak-font-body); }
.composer textarea[aria-invalid="true"] { border-color: var(--ak-danger); }
.err { font: 600 13px/1.4 var(--ak-font-sans); margin-top: 6px; }
.err:empty { display: none; }
.kbd-hint { font: 500 12px/1.3 var(--ak-font-sans); color: var(--ak-fg-muted); }
.flash { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ak-border); font: 500 14px/1.4 var(--ak-font-sans); }
.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-top: 18px; }
.specs .wide { grid-column: 1 / -1; }
.specs dt { margin-bottom: 4px; font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ak-fg-muted); }
.specs dd { font-size: 14px; }
.quote { padding: 10px 12px; background: var(--ak-paper); border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-sm); font: 400 14px/1.6 var(--ak-font-mono); }
.quote-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.prompt { padding: 10px 12px; background: var(--ak-bg-sunken); border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-sm); font: 400 14px/1.6 var(--ak-font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt-note { margin-top: 6px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; }
.ref { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 11px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill); background: var(--ak-bg-base); font: 500 13px/1 var(--ak-font-sans); }
.ref:hover { border-color: var(--ak-fg-muted); }
.kf { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; align-items: center; }
.ph-frame {
  display: grid; place-content: center; gap: 2px; padding: 8px; text-align: center; aspect-ratio: 16 / 9;
  background: var(--ak-bg-raised); border: 1px dashed var(--ak-border); border-radius: var(--ak-radius-xs);
  font: 600 12px/1.3 var(--ak-font-sans); color: var(--ak-fg);
}
.ph-frame small { font: 500 12px/1.3 var(--ak-font-sans); color: var(--ak-fg-muted); }
.ph-frame[data-st="approved"] { border-style: solid; }
.ph-frame[data-st="pending-review"] { background: var(--ak-achievement-soft); border-color: transparent; }
.ph-frame[data-st="not-started"] { background: var(--ak-bg-sunken); }
.ph-portrait { aspect-ratio: 4 / 3; }
.thread { margin-top: 22px; }
.sub-h { font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ak-fg-muted); }
.thread ol { margin-top: 8px; display: grid; gap: 8px; }
.nt { padding: 10px 12px; border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-sm); background: var(--ak-bg-base); }
.nt-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 500 13px/1.4 var(--ak-font-sans); }
.nt-h b { font-weight: 700; }
.nt-t { font-size: 12px; color: var(--ak-fg-muted); }
.nt-s { font: 600 12px/1 var(--ak-font-sans); color: var(--ak-fg-muted); padding: 3px 6px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); }
.nt-b { margin-top: 4px; font-size: 14px; }
.nt-ev { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 500 13px/1.4 var(--ak-font-sans); }
.nt-req { background: var(--ak-danger-soft); border-color: transparent; }

/* ── rail: spend gate + tabs ── */
.rail-panel { display: flex; flex-direction: column; min-height: 0; }
.gate { flex: none; padding: 16px 18px 18px; border-bottom: 1px solid var(--ak-border); }
.rh { font: 500 20px/1.2 var(--ak-font-display); }
.rh:focus { outline: none; }
.rh:focus-visible { outline: 2px solid var(--ak-info); }
.gate-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.gate-n { font: 600 12px/1.3 var(--ak-font-sans); color: var(--ak-fg-muted); }
.job { margin-top: 12px; padding: 14px; background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); }
.job[data-st="awaiting-approval"] { border-color: var(--ak-achievement); }
.job-kicker { font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ak-fg-muted); }
.job-label { margin-top: 4px; font: 600 15px/1.35 var(--ak-font-sans); }
.est { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 12px; }
.est-k { font: 600 12px/1 var(--ak-font-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ak-fg-muted); }
.est-v { font: 600 30px/1 var(--ak-font-mono); }
.est-c { font: 500 12px/1 var(--ak-font-mono); color: var(--ak-fg-muted); }
.est-n { margin-top: 6px; font: 500 13px/1.45 var(--ak-font-sans); color: var(--ak-fg-muted); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin-top: 12px; font-size: 14px; }
.facts dt { font: 500 13px/1.55 var(--ak-font-sans); color: var(--ak-fg-muted); }
.facts dd { min-width: 0; overflow-wrap: anywhere; }
.units { display: flex; flex-wrap: wrap; gap: 4px; }
.unit { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); background: var(--ak-bg-base); font: 500 12px/1 var(--ak-font-mono); }
.unit:hover { border-color: var(--ak-fg-muted); }
.job-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.job-act .btn-primary { flex: 1 1 0; min-width: 0; }
.tg-l { display: inline; }
.job-done { margin-top: 12px; font: 500 14px/1.45 var(--ak-font-sans); }
.meter { margin-top: 16px; }
.meter-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meter-h .mono { font-size: 12px; color: var(--ak-fg-muted); }
.bar { display: flex; height: 12px; margin-top: 8px; background: var(--ak-bg-sunken); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill); overflow: hidden; }
.seg { display: block; height: 100%; min-width: 0; }
.seg-spent, .sw-spent { background: var(--ak-kola-amber); }
.seg-commit, .sw-commit { background: var(--ak-primary); }
.seg-pend, .sw-pend { background: repeating-linear-gradient(135deg, var(--ak-achievement) 0 3px, transparent 3px 6px); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--ak-border); flex: none; }
.mrows { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; margin-top: 10px; font-size: 14px; }
.mrows dt { display: flex; align-items: center; gap: 8px; color: var(--ak-fg-muted); font: 500 13px/1.5 var(--ak-font-sans); }
.mrows dd { text-align: right; }
.mrows .tot { padding-top: 6px; border-top: 1px solid var(--ak-border-soft); color: var(--ak-fg); font-weight: 600; }
.meter .fine { margin-top: 10px; }
.rail-tabs { flex: none; display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--ak-border); }
.rtab { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; margin-bottom: -1px; border-bottom: 2px solid transparent; font: 600 14px/1 var(--ak-font-sans); color: var(--ak-fg-muted); }
.rtab:hover { color: var(--ak-fg); }
.rtab[aria-selected="true"] { color: var(--ak-fg); border-bottom-color: var(--ak-primary); }
.rp-body { padding: 16px 18px 32px; }
.rp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.bib-group + .bib-group { margin-top: 24px; }
.bib-gh { display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--ak-border-soft); font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ak-fg-muted); }
.logline { margin-top: 10px; font: 400 italic 16px/1.5 var(--ak-font-display); }
.bib-group .fine { margin-top: 6px; }
.bib { padding: 14px 0; border-bottom: 1px solid var(--ak-border-soft); scroll-margin-top: 12px; border-radius: var(--ak-radius-xs); }
.bib:focus { outline: none; }
.bib-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.bib-name { font: 500 17px/1.25 var(--ak-font-display); }
.bib-role { font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ak-fg-muted); margin-top: 2px; }
.bib-d { margin-top: 6px; font-size: 14px; }
.bib-frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; align-items: start; }
.bib-frames figcaption { margin-top: 5px; }
.bib-use { margin-top: 8px; font: 500 12px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.bib-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font: 500 13px/1.4 var(--ak-font-sans); }
.look { margin-top: 10px; display: grid; gap: 6px; }
.look li { position: relative; padding-left: 16px; font-size: 14px; }
.look li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 8px; height: 1px; background: var(--ak-fg-muted); }
.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger th { padding: 8px 6px; border-bottom: 1px solid var(--ak-border); text-align: left; font: 600 12px/1.2 var(--ak-font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ak-fg-muted); }
.ledger td { padding: 10px 6px; border-bottom: 1px solid var(--ak-border-soft); vertical-align: top; }
.ledger .amt { text-align: right; white-space: nowrap; }
.ledger .lu small { display: block; font: 400 12px/1.4 var(--ak-font-mono); color: var(--ak-fg-muted); overflow-wrap: anywhere; }
.ledger .lt { white-space: nowrap; }
.ledger .lt small { display: block; font: 500 12px/1.3 var(--ak-font-sans); color: var(--ak-fg-muted); }
.ledger tfoot th, .ledger tfoot td { padding-top: 12px; border-bottom: 0; font: 700 14px/1.2 var(--ak-font-sans); color: var(--ak-fg); letter-spacing: 0; text-transform: none; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font: 500 13px/1.45 var(--ak-font-sans); color: var(--ak-fg-muted); }

.rail-ref, .rail-bar { display: contents; }
.rail-pin { display: none; gap: 6px; padding: 8px 16px 10px; border-bottom: 1px solid var(--ak-border); }
.pin-line { font: 500 13px/1.4 var(--ak-font-sans); color: var(--ak-fg-muted); }
.pin-line b { color: var(--ak-fg); font-weight: 700; }
.pin-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.thread-none { margin-top: 6px; }
.kf-note { font-size: 13px; }
.model { font-size: 13px; }
.gate-none { margin-top: 10px; }
.ledger-note { margin-top: 8px; }
.rtab-n { font-size: 12px; }
.job-st { display: inline-block; margin-left: 8px; padding: 2px 7px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-pill); font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: 0; text-transform: none; color: var(--ak-fg); }
.job[data-st="awaiting-approval"] .job-st { background: var(--ak-achievement-soft); border-color: transparent; }
.chat-line { margin-top: 10px; }
code { font: 500 13px/1.4 var(--ak-font-mono); padding: 1px 5px; background: var(--ak-bg-sunken); border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-xs); color: var(--ak-fg); overflow-wrap: anywhere; }
.nt-sys { color: var(--ak-fg-muted); }
.nt-sys b { color: var(--ak-fg); }
.warn-bar { margin: 0; padding: 8px 20px; background: var(--ak-achievement-soft); color: var(--ak-fg); border-bottom: 1px solid var(--ak-border); font: 600 13px/1.45 var(--ak-font-sans); }
.warn-bar[hidden] { display: none; }
[data-akuko-action][aria-disabled="true"] { opacity: .55; cursor: default; }
.sample-msg { display: block; flex: 1 1 100%; margin-top: 6px; font: 600 13px/1.4 var(--ak-font-sans); color: var(--ak-fg); }
@media (min-width: 761px) { .foot { flex-wrap: nowrap; white-space: nowrap; } .foot-id { display: none; } }
.foot-warn { color: var(--ak-fg); font-weight: 600; }
/* real projects (WP-29): parts, cards, gates, rules */
.f-lbl { align-self: center; margin-right: 2px; font: 600 12px/1 var(--ak-font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ak-fg-muted); }
.filters:not([hidden]) + .filters { margin-top: 6px; }
.filters[hidden] { display: none; }
.removed-grp > summary { cursor: pointer; list-style: none; }
.removed-grp > summary::-webkit-details-marker { display: none; }
.removed-grp > summary h3::before { content: "▸"; color: var(--ak-fg-muted); }
.removed-grp[open] > summary h3::before { content: "▾"; }
.removed-grp .card-row { opacity: .8; }
.ph-card { display: grid; place-content: center; width: 112px; aspect-ratio: 16 / 9; background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); font: 700 12px/1 var(--ak-font-sans); letter-spacing: .1em; color: var(--ak-fg-muted); }
.card-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 20px; }
.card-row .bib-act { margin-top: 6px; }
.flag { display: inline-block; padding: 2px 6px; border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); font: 600 12px/1.2 var(--ak-font-sans); color: var(--ak-fg); }
.flag-off { border-style: dashed; color: var(--ak-fg-muted); }
.gt { padding: 14px 0; border-bottom: 1px solid var(--ak-border-soft); }
.gt-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 10px; }
.gt-id { font: 600 15px/1.3 var(--ak-font-mono); }
.gt-t { margin-top: 2px; font: 500 16px/1.35 var(--ak-font-display); }
.gt-scope, .gt-count { margin-top: 6px; font: 500 14px/1.45 var(--ak-font-sans); color: var(--ak-fg-muted); }
.gt-count b { color: var(--ak-fg); }
.gt .bar { margin-top: 8px; }
.seg-ok { background: var(--ak-success); }
.seg-wait { background: repeating-linear-gradient(135deg, var(--ak-achievement) 0 3px, transparent 3px 6px); }
.seg-back { background: var(--ak-danger); }
.gt-sign { margin-top: 10px; padding: 10px 12px; background: var(--ak-bg-raised); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); font-size: 14px; }
.gt-sign b { font-weight: 700; }
.gt-notes { margin-top: 8px; display: grid; gap: 4px; font: 500 14px/1.45 var(--ak-font-sans); color: var(--ak-fg); }
.gt-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.ppl { display: grid; gap: 4px; margin-bottom: 6px; font-size: 14px; }
.rules-dl { display: grid; gap: 4px 0; }
.rules-dl dt { margin-top: 12px; font: 600 12px/1.3 var(--ak-font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ak-fg-muted); }
.rules-dl dd ul { display: grid; gap: 4px; }
.rules-dl dd li { font-size: 14px; }
/* pictures (@0.5): real images where the project has them, a labelled frame where it has none */
.pic { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--ak-bg-sunken); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-xs); }
.pic-portrait { aspect-ratio: 4 / 3; }
.pic-contain { object-fit: contain; }
.thumb img.pic { height: 100%; }
.ph-card img.pic { height: 100%; border: 0; }
.zoom { display: block; width: 100%; padding: 0; border-radius: var(--ak-radius-xs); cursor: zoom-in; }
.zoom:hover .pic, .zoom:hover svg { outline: 2px solid var(--ak-fg-muted); outline-offset: 1px; }
.zoom-cap { display: block; margin-top: 4px; font: 500 12px/1.35 var(--ak-font-sans); color: var(--ak-fg-muted); text-decoration: underline; text-underline-offset: 2px; }
.lb { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,.78); }
.lb[hidden] { display: none; }
.lb-box { display: grid; gap: 10px; max-width: min(1200px, 100%); max-height: 100%; padding: 14px; background: var(--ak-bg-surface); color: var(--ak-fg); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-lg); box-shadow: var(--ak-shadow-3); }
.lb-media { display: grid; place-items: center; min-height: 0; overflow: auto; }
.lb-media img { display: block; max-width: 100%; max-height: calc(100vh - 160px); object-fit: contain; border-radius: var(--ak-radius-sm); }
.lb-media svg { display: block; width: min(1100px, 86vw); height: auto; max-height: calc(100vh - 160px); }
.lb-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; font: 500 14px/1.4 var(--ak-font-sans); }
/* the stage lens: what a pipeline stage holds, at the top of the middle pane */
.stage[data-lens="1"] { box-shadow: inset 0 -3px 0 var(--ak-info); }
.stage[data-lens="1"] .st-top { color: var(--ak-fg); }
.lens { padding: 14px 20px 18px; background: var(--ak-bg-surface); border-bottom: 1px solid var(--ak-border); }
.lens:empty { display: none; }
.lens-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.lens-t { font: 500 18px/1.25 var(--ak-font-display); }
.lens-t:focus { outline: none; }
.lens-t:focus-visible { outline: 2px solid var(--ak-info); }
.lens-s { margin-top: 4px; font: 500 14px/1.45 var(--ak-font-sans); color: var(--ak-fg-muted); }
.lens-s b { color: var(--ak-fg); }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.gal figure { min-width: 0; }
.gal figcaption { display: grid; gap: 4px; margin-top: 6px; font: 500 13px/1.4 var(--ak-font-sans); }
.gal .g-name { font: 600 14px/1.3 var(--ak-font-sans); }
.gal figcaption .chip { justify-self: start; }
.gal .bib-act { margin-top: 2px; }
.lens .ph-frame { min-height: 90px; }
.stflag { display: inline-flex; align-items: center; gap: 5px; }
/* intake documents, above the script */
.intake { margin: 20px 20px 0; padding: 14px 16px; background: var(--ak-bg-surface); border: 1px solid var(--ak-border); border-radius: var(--ak-radius-md); scroll-margin-top: 12px; }
.intake:empty { display: none; }
.intake-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.intake-t { font: 500 18px/1.25 var(--ak-font-display); }
.intake-t:focus { outline: none; }
.intake-t:focus-visible { outline: 2px solid var(--ak-info); }
.doc { padding: 12px 0; border-bottom: 1px solid var(--ak-border-soft); }
.doc:last-child { border-bottom: 0; padding-bottom: 0; }
.doc-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.doc-name { font: 600 15px/1.3 var(--ak-font-sans); }
.doc details { margin-top: 8px; }
.doc summary { cursor: pointer; font: 600 13px/1.4 var(--ak-font-sans); }
.doc pre { margin-top: 8px; max-height: 420px; overflow: auto; padding: 10px 12px; background: var(--ak-paper); border: 1px solid var(--ak-border-soft); border-radius: var(--ak-radius-sm); font: 400 13px/1.6 var(--ak-font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
/* "done reviewing": a line to paste into chat (the chat only acts when you write to it) */

.pnl .pk { font: 700 6px var(--ak-font-sans); letter-spacing: .5px; fill: var(--ak-fg-muted); }
.pnl .pd { font: 500 6px var(--ak-font-mono); fill: var(--ak-fg-muted); }
.pnl .pm { fill: none; stroke: var(--ak-fg); stroke-width: .8; stroke-dasharray: 2.2 1.6; }
.pnl .pa { fill: none; stroke: var(--ak-fg); stroke-width: 1; stroke-linecap: round; }

  /* ── gates: scope progress and who signed (WP-29) ────────

  function gateUnits(g) {
    const sc = g.scope || {};
    const want = { shots: sc.shots || [], scenes: sc.scenes || [], parts: sc.parts || [] };
    const filtered = want.shots.length + want.scenes.length + want.parts.length > 0;
    const removed = x => !!(x && x.source && x.source.removed_at);
    const matches = s => !filtered || want.shots.indexOf(s.id) !== -1 || (s.scene != null && want.scenes.indexOf(s.scene) !== -1) || (s.part != null && want.parts.indexOf(s.part) !== -1);
    const shots = D.shots.filter(s => !s.removed && matches(s));
    const shotIds = {}; shots.forEach(s => { shotIds[s.id] = true; });
    const named = {}; shots.forEach(s => { s.refs.forEach(r => { named[r] = true; }); if (s.lighting) named[s.lighting] = true; });
    const entries = [].concat(P.bible.characters || [], P.bible.locations || [], P.bible.styles || []).filter(e => !removed(e) && (!filtered || named[e.id]));
    const entryIds = {}; entries.forEach(e => { entryIds[e.id] = true; });
    const assets = D.assets.filter(a => !a.removed && (!filtered || (a.owner && (shotIds[a.owner] || entryIds[a.owner])) || (a.kind === 'card' && a._part != null && want.parts.indexOf(a._part) !== -1)));
    const ok = st => sc.stage == null || st === sc.stage;
    return [].concat(
      shots.filter(s => ok(s.stage)).map(s => ({ id: s.id, status: shotStatus(s.id) })),
      assets.filter(a => ok(a.stage)).map(a => ({ id: a.id, status: assetStatus(a) })),
      entries.filter(e => ok(e.stage)).map(e => ({ id: e.id, status: entryStatus(bibleById[e.id] ? bibleById[e.id].item : { id: e.id, status: e.status }) })));
  }
  const person = id => D.people.find(x => x.id === id);

    if (sc.scenes && sc.scenes.length) bits.push((sc.scenes.length > 1 ? 'scenes ' : 'scene ') + sc.scenes.join(', '));
    if (sc.shots && sc.shots.length) bits.push(sc.shots.length + ' ' + plural(sc.shots.length, 'named shot'));

      '<div class="gt-h"><h4 class="gt-id" id="gt-' + esc(g.id) + '">' + esc(g.id) + '</h4><span class="chip" data-st="' + (signed ? 'approved' : ap === n && n ? 'pending-review' : 'not-started') + '">' + glyph(signed ? 'approved' : ap === n && n ? 'pending-review' : 'not-started') + esc(state) + '</span></div>' +

      '<p class="gt-count" data-gate-progress="' + esc(g.id) + '"><b>' + ap + '/' + n + '</b> approved' + (wt ? ' · ' + wt + ' waiting for review' : '') + (bk ? ' · ' + bk + ' sent back' : '') + (rest ? ' · ' + rest + ' not made yet' : '') + '</p>' +
      (signed

      case 'spend-ok': {
        const j = D.pending_spend.find(x => x.id === id); if (!j) return;
        decide({ action: 'approve-spend', unit: id, stage: j.stage, text: 'approve ' + gateNum(bound(j)) + ' ' + ((D.budget && D.budget.currency) || 'USD') });
        announce('Spend approved: ' + money(bound(j)) + ' for ' + j.label); commit('spend-undo:' + id); break;
      }
      case 'spend-no': { const j = D.pending_spend.find(x => x.id === id); if (j) decide({ action: 'decline-spend', unit: id, stage: j.stage }); announce('Spend declined for now'); commit('spend-undo:' + id); break; }
      case 'spend-undo': {
        const j = D.pending_spend.find(x => x.id === id), tg = j && undoTarget(id, ['approve-spend', 'decline-spend']); if (!tg) return;
        decide({ action: 'undo', unit: id, stage: j.stage, undoes: tg.id });
        announce('Spend is waiting for your decision again'); commit('spend-ok:' + id); break;
      }
      case 'unit-ok': {
        decide({ action: 'approve', unit: id, stage: stageOf(id) });
        announce('Approved'); commit('unit-undo:' + t.dataset.k.slice('unit-ok:'.length)); break;
      }
      case 'unit-undo': {
        const tg = undoTarget(id, ['approve']); if (!tg) return;
        decide({ action: 'undo', unit: id, stage: stageOf(id), undoes: tg.id });
        announce('Undone'); commit('unit-ok:' + t.dataset.k.slice('unit-undo:'.length)); break;
      }
      case 'mode': S.mode = S.mode === 'dark' ? 'light' : 'dark'; S.modeChosen = true; commit('mode'); break;
      case 'export': copyDecisions(); break;
      case 'gate-top': { const rl = $('#rail'); if (rl) rl.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); const hh = $('#h-spend'); if (hh) hh.focus({ preventScroll: true }); break; }
      case 'load': { const fi = $('#file-in'); if (fi) fi.click(); break; }
    }
  });
  document.addEventListener('toggle', e => {
    const t = e.target;
    if (!t) return;
    if (t.id === 'removed-grp') S.showRemoved = t.open;
    if (t.dataset && t.dataset.doc) {
      OPEN_DOCS[t.dataset.doc] = t.open;
      /* a document in the artifact's asset store is read (GET, same page) the first time it is opened */
      const uri = t.dataset.fetchDoc;
      if (t.open && uri && BLOB.test(uri) && MEDIA.texts[uri] == null && typeof fetch === 'function') {
        MEDIA.texts[uri] = 'Loading…';
        fetch(uri).then(r => (r && r.ok ? r.text() : Promise.reject(new Error('not found')))).then(x => { MEDIA.texts[uri] = String(x).slice(0, 262144); scheduleRender(); }, () => { MEDIA.texts[uri] = 'This document can’t be read here.'; scheduleRender(); });
      }
    }
  }, true);
  /* a picture that fails to load is replaced by a labelled frame ("image not available here"), never retried in a loop */
  document.addEventListener('error', e => {
    const t = e.target;
    if (!t || t.tagName !== 'IMG') return;
    const big = t.getAttribute('data-ak-big');
    if (big) {
      if (!BROKEN['big:' + big]) {
        BROKEN['big:' + big] = true;
        const a = D.assets.find(x => x.uri === big), alt = a ? imgSrc(a) : '';
        if (alt && alt !== t.getAttribute('src')) { t.setAttribute('src', alt); return; }
      }
      const p = document.createElement('p'); p.className = 'fine'; p.textContent = 'This picture can’t be shown here.'; t.replaceWith(p);
      return;
    }
    const uri = t.getAttribute('data-ak-img');
    if (uri && !BROKEN[uri]) { BROKEN[uri] = true; scheduleRender(); }
  }, true);
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form="compose"]');
    if (!f) return;
    e.preventDefault(); submitCompose(f);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'compose-text' && S.compose) {
      S.compose.text = e.target.value;
      if (e.target.value.trim()) { e.target.removeAttribute('aria-invalid'); const er = $('#compose-err'); if (er) er.textContent = ''; }
    }
  });
  document.addEventListener('keydown', e => {
    const lb = $('#lightbox');
    if (lb && !lb.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeZoom(); return; }
      if (e.key === 'Tab') { e.preventDefault(); $('#lb-close').focus(); return; }
    }
    if (e.target.id === 'compose-text') {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitCompose(e.target.form); return; }
      if (e.key === 'Escape') { e.preventDefault(); const id = S.compose && S.compose.id; S.compose = null; renderAll(id ? 'approve:' + id : null); return; }
    }
    if (e.target.getAttribute && e.target.getAttribute('role') === 'tab' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home' || e.key === 'End')) {
      e.preventDefault();
      const tabs = $$('#rail-tabs [role="tab"]'), i = tabs.indexOf(e.target);
      const n = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      S.rail = tabs[n].dataset.id; commit('rail:' + S.rail);
    }
  });

  /* linked hover: script line <-> tramline <-> shot row */
  let hoverId = null;
  function paintHover() {
    $$('.is-hint').forEach(el => el.classList.remove('is-hint'));
    if (!hoverId) return;
    const ln = document.getElementById('ln-' + hoverId); if (ln) ln.classList.add('is-hint');
    $$('#lining [data-id="' + hoverId + '"]').forEach(el => el.classList.add('is-hint'));
    const row = $('#shot-' + hoverId + ' > .shot-row'); if (row) row.classList.add('is-hint');
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest ? e.target.closest('[data-hover]') : null;
    const id = el ? el.dataset.hover : null;
    if (id !== hoverId) { hoverId = id; paintHover(); }
  });

  /* ── live data: reads only, so the board never needs republishing ──
     A  the board's artifact database: doc akuko/project, collection decisions
     B  akuko.json beside the page (when the page is served), or a file you pick
     C  the same, through the Ikenga viewer
     A newer project replaces the page's embedded snapshot; the page never writes it. */
  function ingestProject(p, kind) {
    SRC.ok = true;
    if (!isProject(p) || !p.project || (!isSample() && p.project.slug !== P.project.slug)) return;
    SRC.kind = kind; SRC.at = new Date();
    const sig = JSON.stringify(p);
    if (sig === lastSig && !isSample()) { renderFoot(); return; }
    lastSig = sig;
    setProject(p);
    if (S.sel && !shotsById[S.sel]) { S.sel = null; S.compose = null; S.flash = null; }
    if (S.sel && shotsById[S.sel] && shotsById[S.sel].removed) S.sel = null;
    if (!S.sel) { const f = FILM.find(s => live(s) && s.status === 'pending-review'); S.sel = (f || FILM.find(live) || { id: null }).id; }
    buildScript();
    renderAll();
  }
  function ingestRows(rows) {
    const next = rows.filter(validDecision);
    const sig = next.map(d => d.id).sort().join(',');
    if (sig === remote.map(d => d.id).sort().join(',')) return;
    remote = next;
    scheduleRender();
  }
  const snapData = s => { if (!s) return null; const ex = typeof s.exists === 'function' ? s.exists() : s.exists; if (ex === false) return null; const d = typeof s.data === 'function' ? s.data() : s.data; return d || null; };
  function rowsFrom(qs) {
    const out = [];
    const each = qs && (qs.docs || null);
    const push = d => { const v = typeof d.data === 'function' ? d.data() : d.data; if (v && v.action) out.push(v); else if (v && v.data && v.data.action) out.push(v.data); else if (d && d.action) out.push(d); };
    if (Array.isArray(each)) each.forEach(push); else if (qs && typeof qs.forEach === 'function') qs.forEach(push);
    return out;
  }
  function watchDb() {
    window.claude.use('db').then(db => {
      if (!db) { SRC.ok = false; renderFoot(); return; }
      const pdoc = db.doc('akuko/project'), dcol = db.collection('decisions');
      const takeP = s => { const d = snapData(s); if (d) ingestProject(d, 'artifact-db'); };
      const takeD = qs => ingestRows(rowsFrom(qs));
      const pull = () => {
        if (document.hidden) return;
        try { pdoc.get().then(takeP, () => {}); } catch (e) { /* offline */ }
        try { dcol.get().then(takeD, () => {}); } catch (e) { /* offline */ }
      };
      try { if (typeof pdoc.onSnapshot === 'function') pdoc.onSnapshot(takeP, () => {}); } catch (e) { /* poll instead */ }
      try { if (typeof dcol.onSnapshot === 'function') dcol.onSnapshot(takeD, () => {}); } catch (e) { /* poll instead */ }
      pull();
      setInterval(pull, 20000);
    }).catch(() => { SRC.ok = false; });
    window.claude.use('user').then(u => { if (u && typeof u.id === 'function') return u.id().then(id => { if (id) { myId = id; scheduleRender(); } }); }).catch(() => {});
  }
  function watchFile() {
    if (typeof fetch !== 'function' || location.protocol === 'file:') return; // a file page can't read its neighbours: use Load akuko.json
    const urls = ['akuko.json', '../akuko.json'];
    let at = 0;
    const pull = () => {
      if (document.hidden) return;
      const url = urls[at % urls.length];
      fetch(url, { cache: 'no-store' }).then(r => (r && r.ok ? r.json() : null)).then(p => { if (p && isProject(p)) { projBase = url === 'akuko.json' ? '' : '../'; ingestProject(p, 'file'); } else at++; }).catch(() => { at++; });
    };
    pull();
    setInterval(pull, 15000);
  }
  document.addEventListener('change', e => {
    if (e.target.id !== 'file-in') return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { ingestProject(JSON.parse(String(rd.result)), 'picked'); announce('Loaded ' + f.name); } catch (err) { announce('That file is not an akuko.json'); } e.target.value = ''; };
    rd.readAsText(f);
  });

  /* ── boot ─────────────────────────────────────────────── */
  if (S.sel && shotsById[S.sel] && shotsById[S.sel].removed) S.sel = null;
  if (!S.sel) { const p0 = FILM.find(s => live(s) && s.status === 'pending-review'); S.sel = (p0 || FILM.find(live) || { id: null }).id; }
  buildScript();
  renderAll();
  W.onChange(scheduleRender);
  { const rail = $('#rail'); if (rail) rail.addEventListener('scroll', syncStuck, { passive: true }); }
  if (window.MutationObserver) {
    new MutationObserver(() => { const m = hostMode(); if (m && !S.modeChosen && m !== S.mode) { S.mode = m; renderAll(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode'] });
  }
  if (window.claude && typeof window.claude.use === 'function') watchDb(); else watchFile();
  const relayout = () => requestAnimationFrame(layoutLining);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe($('#paper'));
  window.addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout).catch(() => {});
  const onMq = () => { renderNav(); relayout(); };
  [mqMobile, mqWide].forEach(mq => { if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); });
  window.addEventListener('load', () => { renderHeader(); relayout(); });
  requestAnimationFrame(() => {
    layoutLining();
    if (S.sel && !isMobile()) {
      const row = $('#shot-' + S.sel + ' .shot-row');
      if (row) row.scrollIntoView({ block: 'start' });
      const ln = document.getElementById('ln-' + S.sel);
      if (ln) { const sc = $('#script-scroll'); if (sc) sc.scrollTop = Math.max(0, ln.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 3); }
      window.scrollTo(0, 0);
    }
  });
})();
</script>
</body>
