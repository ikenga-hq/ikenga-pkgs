      (s.blocking || []).map(function (b) { return '<rect x="' + (b.x * 160) + '" y="' + (b.y * 90) + '" width="' + (b.w * 160) + '" height="' + (b.h * 90) + '" fill="none" stroke="#f08a4b"/><text x="' + (b.x * 160 + 2) + '" y="' + (b.y * 90 + 12) + '" fill="#f4ede5" font-size="12">' + esc(b.who) + '</text>'; }).join('') + '</svg>';
  }
  function undoBtn(unit, undone) {
    var d = lastOn(unit, undone);
    return d ? '<button type="button" data-akuko-action="undo" data-akuko-unit="' + esc(unit) + '" data-akuko-undoes="' + d.id + '">Undo ' + esc(d.action) + '</button>' : '';
  }

  function render() {
    var R = view(), V = R.V;
    var waitShots = V.shots.filter(function (s) { return s.status === 'pending-review'; }).length;
    var waitSpend = V.pending_spend.filter(function (j) { return j.status === 'awaiting-approval'; }).length;
    var assetIds = {};
    V.assets.forEach(function (a) { assetIds[a.id] = true; });
    var waitOther = V.assets.filter(function (a) { return a.status === 'pending-review'; }).length +
      V.bible.characters.concat(V.bible.locations, V.bible.styles).filter(function (e) { return e.status === 'pending-review' && !(e.refs || []).some(function (r) { return assetIds[r]; }); }).length;
    $('#your-move').innerHTML = '<h2>Your move</h2><p><strong data-akuko-field="waiting-shots">' + waitShots + '</strong> shots waiting for you · <span data-akuko-field="waiting-spend">' + waitSpend + '</span> spend decisions · <span data-akuko-field="waiting-other">' + waitOther + '</span> bible items</p>';
    $('#title').textContent = V.project.title;

    $('#pipeline').innerHTML = '<ol>' + STAGES.map(function (st) {
      var cur = V.current_stage === st[0];
      return '<li class="stage' + (cur ? ' current' : '') + '" data-akuko-field="stage" data-akuko-stage="' + st[0] + '" data-akuko-status="' + esc(V.stages[st[0]].state) + '">' + st[1] + ': ' + esc(V.stages[st[0]].state) +
        (cur ? ' <span data-akuko-field="current-stage" data-akuko-stage="' + st[0] + '">(current)</span>' : '') + '</li>';
    }).join('') + '</ol>';

    if (!S.sel || !R.units[S.sel]) { var p = V.shots.filter(function (s) { return s.status === 'pending-review'; })[0] || V.shots[0]; S.sel = p && p.id; }
    $('#shots').innerHTML = '<h2 id="h-shots">Shots</h2>' + V.scenes.map(function (sc) {
      return '<div data-akuko-field="scene" data-akuko-unit="' + esc(sc.id) + '"><h3>' + esc(sc.heading || sc.id) + '</h3><ul>' + V.shots.filter(function (s) { return s.scene === sc.id; }).map(function (s) {
        return '<li data-akuko-field="shot" data-akuko-unit="' + esc(s.id) + '"><button type="button" data-select="' + esc(s.id) + '" aria-pressed="' + (S.sel === s.id) + '"><span class="mono">' + esc(s.id) + '</span></button> ' +
          '<span data-akuko-field="shot-type">' + esc(s.shot_type) + '</span> · <span data-akuko-field="duration">' + esc(s.duration_s) + ' s</span> · <span data-akuko-field="status" data-akuko-status="' + esc(s.status) + '">' + esc(s.status) + '</span>' + panel(s) + '</li>';
      }).join('') + '</ul></div>';
    }).join('');

    var s = R.units[S.sel];
    var det = $('#detail');
    det.setAttribute('data-akuko-unit', s ? s.id : '');
    if (s) {
      var open = s.status === 'pending-review' || s.status === 'needs-rework';
      var comp = S.compose && S.compose.unit === s.id
        ? '<form data-compose><label for="ctext">' + (S.compose.action === 'note' ? 'Your note' : 'What should change?') + '</label><textarea id="ctext" data-akuko-text></textarea><button type="submit" class="primary" data-akuko-submit>Send</button><button type="button" data-cancel>Cancel</button></form>'
        : '';
      det.innerHTML = '<h2>Shot <span class="mono">' + esc(s.id) + '</span></h2>' + panel(s) +
        '<dl><dt>Status</dt><dd data-akuko-field="status" data-akuko-status="' + esc(s.status) + '">' + esc(s.status) + '</dd>' +
        '<dt>Camera</dt><dd data-akuko-field="camera">' + esc(s.camera) + '</dd><dt>Action</dt><dd data-akuko-field="action">' + esc(s.action) + '</dd>' +
        '<dt>Duration</dt><dd data-akuko-field="duration">' + esc(s.duration_s) + ' s</dd><dt>Script</dt><dd data-akuko-field="script-line">' + esc(s.script_line) + '</dd>' +
        '<dt>Prompt</dt><dd data-akuko-field="prompt">' + esc(s.prompt) + '</dd><dt>Refs</dt><dd data-akuko-field="refs">' + esc((s.refs || []).join(', ')) + '</dd></dl>' +
        '<h3>Comments</h3><ul data-akuko-field="comments">' + (s.comments || []).map(function (c) { return '<li>' + esc(c.author) + ': ' + esc(c.text) + '</li>'; }).join('') + '</ul>' +
        (open ? '<button type="button" class="primary" data-akuko-action="approve" data-akuko-unit="' + esc(s.id) + '">Approve ' + esc(s.id) + '</button>' +
          '<button type="button" data-akuko-action="request-changes" data-akuko-unit="' + esc(s.id) + '">Request changes</button>' : '') +
        '<button type="button" data-akuko-action="note" data-akuko-unit="' + esc(s.id) + '">Add a note</button>' + undoBtn(s.id, R.undone) + comp;
    } else det.innerHTML = '<h2>Shot</h2><p>No shot selected.</p>';

    $('#script').innerHTML = '<h2 id="h-script">Script</h2><ol>' + V.shots.filter(function (x) { return x.script_line; }).map(function (x) {
      return '<li>' + esc(x.script_line) + ' <button type="button" data-akuko-field="script-tag" data-akuko-unit="' + esc(x.id) + '" data-select="' + esc(x.id) + '">' + esc(x.id) + '</button></li>';
    }).join('') + '</ol>';

    var b = V.budget;
    var spentDone = 0, sunk = 0, flight = 0;
    V.ledger.forEach(function (e) { if (e.status === 'done') spentDone += e.actual || 0; else if (e.status === 'submitted') flight += e.estimate || 0; else sunk += e.actual || 0; });
    var ran = function (j) { return V.ledger.some(function (e) { return e.job === j.id && (e.status === 'submitted' || e.status === 'done'); }); };
    var committed = V.pending_spend.filter(function (j) { return j.status === 'approved' && !ran(j); }).reduce(function (a, j) { return a + (j.approved_max != null ? j.approved_max : j.estimate); }, 0);
    var awaiting = V.pending_spend.filter(function (j) { return j.status === 'awaiting-approval'; }).reduce(function (a, j) { return a + j.estimate; }, 0);
    $('#spend').innerHTML = '<h2 id="h-spend">Spend gate</h2>' + V.pending_spend.map(function (j) {
      var bound = j.approved_max != null ? j.approved_max : j.estimate;
      var act = j.status === 'awaiting-approval'
        ? '<button type="button" class="primary" data-akuko-action="approve-spend" data-akuko-unit="' + esc(j.id) + '" data-akuko-text="approve ' + num(bound) + ' ' + esc(CUR) + '">Approve spend · ' + money(bound) + '</button><button type="button" data-akuko-action="decline-spend" data-akuko-unit="' + esc(j.id) + '">Not now</button>'
        : undoBtn(j.id, R.undone);
      return '<article data-akuko-field="job" data-akuko-unit="' + esc(j.id) + '"><h3>' + esc(j.label) + '</h3><p>Estimate <span class="money" data-akuko-field="estimate" data-akuko-unit="' + esc(j.id) + '">' + money(j.estimate) + '</span> · ' + esc(j.provider) + ' · <span data-akuko-field="status" data-akuko-status="' + esc(j.status) + '">' + esc(j.status) + '</span></p>' + act + '</article>';
    }).join('') + (b ? '<dl><dt>Cap</dt><dd class="money" data-akuko-field="cap">' + money(b.cap) + '</dd><dt>Spent</dt><dd class="money" data-akuko-field="spent">' + money(b.spent) + '</dd>' +
      (sunk ? '<dt>Sunk (failed calls)</dt><dd class="money" data-akuko-field="sunk">' + money(sunk) + '</dd>' : '') +
      (flight ? '<dt>In flight</dt><dd class="money" data-akuko-field="in-flight">' + money(flight) + '</dd>' : '') +
      '<dt>Left if you approve</dt><dd class="money" data-akuko-field="left-if-approved">' + money(b.cap - b.spent - sunk - flight - committed - awaiting) + '</dd></dl>' : '<p>No budget cap is set: nothing paid can run. Run <code>/akuko setup</code>.</p>');

    var byOwner = {};
    V.assets.forEach(function (a) { (byOwner[a.owner] = byOwner[a.owner] || []).push(a); });
    $('#bible').innerHTML = '<h2 id="h-bible">Bible</h2>' + V.bible.characters.concat(V.bible.locations, V.bible.styles).map(function (e) {
      return '<div data-akuko-field="bible-entry" data-akuko-unit="' + esc(e.id) + '" data-akuko-status="' + esc(e.status) + '"><h3>' + esc(e.name) + ' <span class="muted">' + esc(e.status) + '</span></h3><ul>' + (byOwner[e.id] || []).map(function (a) {
        return '<li>' + esc(a.kind) + ': <span data-akuko-field="status" data-akuko-unit="' + esc(a.id) + '" data-akuko-status="' + esc(a.status) + '">' + esc(a.status) + '</span> ' +
          (a.status === 'pending-review' ? '<button type="button" data-akuko-action="approve" data-akuko-unit="' + esc(a.id) + '">Approve ' + esc(a.kind) + '</button>' : undoBtn(a.id, R.undone)) + '</li>';
      }).join('') + '</ul></div>';
    }).join('');

    $('#ledger').innerHTML = '<h2 id="h-ledger">Ledger</h2><table><thead><tr><th scope="col">When</th><th scope="col">Unit</th><th scope="col">Charged</th></tr></thead><tbody>' + V.ledger.map(function (e) {
      return '<tr data-akuko-field="ledger-entry"><td class="mono">' + esc(e.ts) + '</td><td>' + esc(e.unit) + ' · ' + esc(e.provider) + '</td><td class="money">' + money(e.actual || 0) + '</td></tr>';
    }).join('') + '</tbody><tfoot><tr><th scope="row" colspan="2">Total</th><td class="money" data-akuko-field="ledger-total">' + money(V.ledger.reduce(function (a, e) { return a + (e.actual || 0); }, 0)) + '</td></tr></tfoot></table>';

    var n = W.all().length;
    $('#foot').innerHTML = W.store() === 'outbox'
      ? (n ? n + ' decisions are waiting for akuko. ' : '') + '<button type="button" data-akuko-export>Copy decisions for akuko</button>' + (W.stored() ? '' : ' Not saved: this browser blocks storage.')
      : 'Your decisions reach akuko on its next action.';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-akuko-action],[data-select],[data-cancel],[data-akuko-export]');
    if (!t) return;
    var R = view();
    if (t.hasAttribute('data-select')) { S.sel = t.getAttribute('data-select'); S.compose = null; render(); return; }
    if (t.hasAttribute('data-cancel')) { S.compose = null; render(); return; }
    if (t.hasAttribute('data-akuko-export')) { try { navigator.clipboard.writeText(W.jsonl()); } catch (err) { /* ignore */ } return; }
    var a = t.getAttribute('data-akuko-action'), unit = t.getAttribute('data-akuko-unit');
    if (a === 'request-changes' || a === 'note') { S.compose = { unit: unit, action: a }; render(); var ta = document.getElementById('ctext'); if (ta) ta.focus(); return; }
    var f = { action: a, unit: unit, stage: stageOf(R.V, unit) };
    if (a === 'undo') f.undoes = t.getAttribute('data-akuko-undoes');
    if (a === 'approve-spend') f.text = t.getAttribute('data-akuko-text');
    W.emit(f);
    if (a === 'approve') {
      // edits the project itself instead of only writing a decision
      if (window.claude) window.claude.use('db').then(function (db) { if (db) db.doc(['akuko', 'project'].join('/')).update({ current_stage: 'bible' }); });
      try { fetch('akuko' + '.json', { method: 'PUT', body: JSON.stringify(P) }); } catch (e) { /* ignore */ }
    }
    render();
  });
  document.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-compose]');
    if (!form || !S.compose) return;
    e.preventDefault();
    var text = document.getElementById('ctext').value.trim();
    if (!text) return;
    W.emit({ action: S.compose.action, unit: S.compose.unit, stage: stageOf(P, S.compose.unit), text: text });
    S.compose = null;
    render();
  });
  W.onChange(render);
  render();
})();
</script>
</body>
</html>
