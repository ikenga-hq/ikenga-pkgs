<!-- INSTRUMENTED TEST COPY (WP-07a, gate G-VIEW) of the locked D-01 design designs/board-b-script-desk.html.
  Changes from the design, nothing else: reads akuko.json (<script id="akuko-project">) through fromAkuko(); data-akuko-view /
  -field / -action marks; writes Decisions through the inlined akuko decision writer instead of the akuko:board-change event;
  money exact to four decimals (no round2 on amounts); a "Copy decisions for akuko" control when no host store is present.
  This is a check-view fixture, not the default board (WP-07b builds that).

akuko board · option B "Script desk" · direction: THE LINED SCRIPT
  Logic: real-world reference, StudioBinder Shot List + Shot Tagger (studiobinder.com/shotlist-app/). Taken: the script beside the shot list,
    a highlighted line tagged to a numbered shot, dense spec rows under scene banners, colour-coded shots, resolvable comment threads.
  Skeleton: two-pane script desk. Tramlined screenplay (JetBrains Mono) <-> shot list that opens inline into the shot detail; slim header
    (title, next action, host badge, 9-stage pipeline); right rail = spend gate on top + sticky Bible / Ledger tabs; at 760px and below, switchable panes.
  Form came from: the story is a confession told line by line, so the board is that confession on script paper, lined like a script
    supervisor's page (tramlines + setup tags, as Scriptation automates), and selecting is the lantern's "single thin ray" landing on one line.
  Assumptions: narration is set as THE NARRATOR (V.O.), each scene summary as its action line; blocking rect x/y = top-left, ellipse x/y = centre;
    bible images were generated (see ledger) but aren't in the fixture, so frames are labelled placeholders; pending bible assets get an Approve. -->

<style>
/* ── tokens: @ikenga/tokens theme A "Dusk Wood" (design-contract.json) ── */

  --desk: var(--bg-sunken);

}

  --bg-base: hsl(36,22%,96%);
  --bg-surface: hsl(36,18%,93%);
  --bg-raised: hsl(36,14%,89%);
  --bg-sunken: hsl(36,26%,98%);

  --kola-amber: hsl(42,78%,50%);
  --danger: hsl(8,68%,42%);
  --danger-fg: hsl(0,0%,98%);

/* ── base ── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg-base); color: var(--fg);
  font: 400 14px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4, p, ol, ul, dl, dd, figure, blockquote, pre { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
body, .pane, .rail, .rail-panel, .scroller, .shot, .bib, .ledger, .dn, .rtab, .ref { position: relative; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; padding: 10px 14px; background: var(--primary); color: var(--primary-fg); border-radius: var(--radius-md); font: 600 14px/1 var(--font-sans); text-decoration: none; }
.skip:focus { top: 8px; }
.money { color: var(--money-fg); background: var(--money-bg); padding: var(--money-pad); border-radius: var(--radius-xs); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fine { font-size: 12px; line-height: 1.5; color: var(--fg-muted); }
.empty { padding: 20px; color: var(--fg-muted); }

/* status glyphs: shape + colour, never colour alone */
.g { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; }
.g-ok { background: var(--success); }
.g-wait { border: 2px solid var(--achievement); }
.g-rework { width: 7px; height: 7px; border-radius: 1px; background: var(--danger); transform: rotate(45deg); }
.g-none { border: 1.5px dashed var(--fg-muted); }
.g-prog { background: var(--info); }
.g-now { background: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft), 0 0 0 3px var(--primary); }
.g-money { border-radius: 1px; background: var(--kola-amber); }
.ico { width: 14px; height: 14px; flex: none; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 9px; border: 1px solid var(--border); border-radius: var(--radius-pill);
  font: 600 12px/1 var(--font-sans); color: var(--fg); white-space: nowrap;
}
.chip[data-st="approved"] { color: var(--fg-muted); }
.chip[data-st="pending-review"] { background: var(--achievement-soft); border-color: transparent; }
.chip[data-st="needs-rework"] { background: var(--danger-soft); border-color: transparent; }
.chip[data-st="not-started"] { color: var(--fg-muted); border-style: dashed; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-raised); color: var(--fg); font: 600 14px/1.1 var(--font-sans); white-space: nowrap;
}
.btn:hover { border-color: var(--fg-muted); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 86%, var(--fg)); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn[aria-disabled="true"] { opacity: .55; cursor: default; }
.btn[aria-disabled="true"]:hover { border-color: var(--border); }
.btn-primary[aria-disabled="true"]:hover { background: var(--primary); border-color: var(--primary); }
.linkbtn { font: 600 13px/1.3 var(--font-sans); text-decoration: underline; text-underline-offset: 3px; color: var(--fg); padding: 4px 2px; }

/* ── header ── */
.top { background: var(--bg-surface); border-bottom: 1px solid var(--border); }
.top-row { display: flex; align-items: center; gap: 20px; padding: 12px 20px; }
.ident { flex: none; display: grid; gap: 1px; }
.eyebrow { font: 600 12px/1.2 var(--font-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-muted); }
.title { font: 500 26px/1.1 var(--font-display); font-variation-settings: "opsz" 96; letter-spacing: -.01em; }
.meta { font-size: 12px; color: var(--fg-muted); }
.next { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding-left: 20px; border-left: 1px solid var(--border); }
.next-txt { min-width: 0; }
.next-main { font: 500 16px/1.3 var(--font-sans); }

.hdot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--fg-muted); flex: none; }

.mode-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font: 600 13px/1 var(--font-sans); }
.mode-btn:hover { border-color: var(--fg-muted); }

/* pipeline: nine slate cells */
.pipeline ol { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); border-top: 1px solid var(--border-soft); }

.desk { display: grid; min-width: 0; }

.pane, .rail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ── script paper ── */
.paper-wrap { padding: 20px; }
.paper {

}
.page-head { text-align: center; margin-bottom: 8px; }

.slug { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.5ch; font: 600 14px/1.55 var(--font-mono); text-transform: uppercase; }

.action { margin-top: 12px; }
.cue { margin: 16px 0 0 12ch; text-transform: uppercase; }
.dlg { margin-left: 6ch; max-width: 34ch; }
.dlg + .dlg { margin-top: 12px; }
.ln { cursor: pointer; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; scroll-margin: 80px; }
.ln.is-hint { background: var(--bg-raised); }
.ln.is-sel { background: var(--primary-soft); box-shadow: 0 0 0 2px var(--primary-soft); }
.ln.is-sel .ln { background: transparent; box-shadow: none; }
.lining { position: absolute; top: 0; right: 0; bottom: 0; width: var(--lining-w); pointer-events: none; }
.lining::before { content: ""; position: absolute; left: 0; top: 28px; bottom: 28px; border-left: 1px dashed var(--border); }
.tram { position: absolute; width: 2px; border-radius: 1px; background: var(--fg-muted); }
.tram::before, .tram::after { content: ""; position: absolute; left: -3px; width: 8px; height: 2px; background: inherit; }
.tram::before { top: 0; }
.tram::after { bottom: 0; }
.tram[data-st="pending-review"] { background: var(--achievement); }
.tram[data-st="needs-rework"] { background: var(--danger); }
.tram.is-hint { background: var(--fg); }
.tram.is-sel { background: var(--primary); width: 4px; margin-left: -1px; }
.tag {
  position: absolute; top: 0; left: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px;

  font: 500 12px/1 var(--font-mono); color: var(--fg); white-space: nowrap;
}
.tag:hover, .tag.is-hint { border-color: var(--fg-muted); }

/* ── shots ── */
.filters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 8px; }

.fchip:hover { color: var(--fg); }

.banner { position: sticky; top: 0; z-index: 2; display: grid; gap: 3px; padding: 12px 20px 10px; background: var(--bg-base); border-bottom: 1px solid var(--border-soft); }

.shot { border-bottom: 1px solid var(--border-soft); }
.shot-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 10px 20px; scroll-margin-top: 72px; }
.shot-row:hover, .shot-row.is-hint { background: var(--bg-surface); }
.shot.is-sel > .shot-row { background: var(--primary-soft); }
.thumb { display: block; width: 112px; aspect-ratio: 16 / 9; }
.thumb svg { display: block; width: 100%; height: 100%; }
.sr-main { min-width: 0; display: grid; gap: 3px; }
.sr-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.sr-id { font: 600 13px/1.3 var(--font-mono); }
.sr-type { font: 700 12px/1.3 var(--font-sans); letter-spacing: .08em; color: var(--fg-muted); }
.sr-tc { font: 400 12px/1.3 var(--font-mono); color: var(--fg-muted); }
.sr-act { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* detail */
.detail { padding: 4px 20px 26px; background: var(--bg-surface); border-top: 1px solid var(--border-soft); }

.panel-big svg { display: block; width: 100%; height: auto; border-radius: var(--radius-sm); }

.specs dd { font-size: 14px; }
.quote { padding: 10px 12px; background: var(--paper); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); font: 400 14px/1.6 var(--font-mono); }
.quote-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.prompt { padding: 10px 12px; background: var(--bg-sunken); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); font: 400 14px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ── storage (always guarded) ─────────────────────────── */

  /* ── state ────────────────────────────────────────────── */

  const shotStatus = id => S.status[id] || shotsById[id].status;
  const shotComments = id => (shotsById[id].comments || []).concat(S.notes[id] || []);
  const assetStatus = (bid, i) => S.asset[bid + ':' + i] || bibleById[bid].item.assets[i].status;
  const spendStatus = j => S.spend[j.id] || j.status;
  function bibleStatus(bid) {

  function counts() {

  }
  const awaitingSpend = () => D.pending_spend.filter(j => spendStatus(j) === 'awaiting-approval');
  function nextPending(from) {

  function save() {

  /* every person's decision goes through the decision format (views/contract.md); no other event */

  /* ── sketch panel: framing diagram from `blocking` ────── */
  function arrow(x1, y1, x2, y2) {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 4.2;
    const p1 = (x2 - h * Math.cos(a - 0.5)).toFixed(2) + ',' + (y2 - h * Math.sin(a - 0.5)).toFixed(2);
    const p2 = (x2 - h * Math.cos(a + 0.5)).toFixed(2) + ',' + (y2 - h * Math.sin(a + 0.5)).toFixed(2);
    return '<line class="pa" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/><polygon class="pah" points="' + x2 + ',' + y2 + ' ' + p1 + ' ' + p2 + '"/>';

    } else if (move === 'whip') {
      g += arrow(26, 13, 134, 13) + '<line class="pa" x1="46" y1="8.5" x2="104" y2="8.5"/><line class="pa" x1="46" y1="17.5" x2="104" y2="17.5"/>';
    } else {

  function describe(s) {
    const where = b => { const cx = b.shape === 'ellipse' ? b.x : b.x + b.w / 2; return cx < 0.4 ? 'left of frame' : cx > 0.6 ? 'right of frame' : 'centre frame'; };
    let t = s.type + ' framing diagram. ' + s.blocking.map(b => b.who + ' ' + where(b)).join(', ') + '.';
    if (s.move) t += ' Camera move: ' + (MOVE[s.move] || s.move) + '.';

  function panelSVG(s, big) {

    if (big) g += '<rect class="ps" x="' + W * 0.05 + '" y="' + H * 0.05 + '" width="' + W * 0.9 + '" height="' + H * 0.9 + '"/>';

        lx = cx; ly = cy;

        g += '<rect class="pb" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) + '" rx=".8"/>';

  /* ── script (built once; painted on change) ───────────── */
  function buildScript() {

        const line = s.script_line || '';

          const at = p.text.indexOf(line);

          return p.inner.every(r => at >= r.e || at + line.length <= r.s);

        if (host) { const at = host.text.indexOf(line); host.inner.push({ id: s.id, s: at, e: at + line.length }); }

        '<p class="action">' + esc(sc.summary) + '</p>' +

    $('#lining').innerHTML = D.shots.map(s => {

  function paintScript() {
    $$('#page .ln').forEach(el => { el.classList.toggle('is-sel', el.dataset.shot === S.sel); });
    $$('#lining .tram').forEach(el => { el.dataset.st = shotStatus(el.dataset.id); el.classList.toggle('is-sel', el.dataset.id === S.sel); });
    $$('#lining .tag').forEach(el => {

      el.classList.toggle('is-sel', sel);

  function layoutLining() {
    const paper = $('#paper'), lining = $('#lining');
    if (!paper || !lining) return;
    const pr = paper.getBoundingClientRect();
    if (!pr.height) return;
    const top0 = pr.top + paper.clientTop;
    const items = [];
    D.shots.forEach(s => {
      const el = document.getElementById('ln-' + s.id);
      if (!el) return;
      const rs = el.getClientRects();
      if (!rs.length) return;
      items.push({ id: s.id, top: rs[0].top - top0, bot: rs[rs.length - 1].bottom - top0 });
    });
    items.sort((a, b) => a.top - b.top);
    const ends = [];
    items.forEach(it => {
      let l = ends.findIndex(e => e < it.top - 1);
      if (l < 0) { l = ends.length; ends.push(it.bot); } else ends[l] = it.bot;
      it.lane = l;
    });
    const narrow = isMobile(), LANE = narrow ? 10 : 12, X0 = narrow ? 9 : 12;
    const tagX = X0 + Math.max(1, ends.length) * LANE + 2;
    let last = -Infinity;
    items.forEach(it => {
      const tram = lining.querySelector('.tram[data-id="' + it.id + '"]');
      const tag = lining.querySelector('.tag[data-id="' + it.id + '"]');
      if (tram) { tram.style.left = (X0 + it.lane * LANE) + 'px'; tram.style.top = it.top + 'px'; tram.style.height = Math.max(8, it.bot - it.top) + 'px'; }
      if (tag) {
        const h = tag.offsetHeight || 24;
        const y = Math.max(it.top - 2, last + 4);
        tag.style.top = y + 'px'; tag.style.left = tagX + 'px';
        last = y + h;
      }
    });
  }

  /* ── shots ────────────────────────────────────────────── */
  function renderShots() {

    const F = [['all', 'All', D.shots.length], ['pending-review', 'Pending review', c['pending-review'] || 0], ['needs-rework', 'Needs rework', c['needs-rework'] || 0], ['approved', 'Approved', c.approved || 0]];

      if (!vis.length) return;

      h += '<section aria-labelledby="bn-' + sc.id + '" data-akuko-field="scene" data-akuko-unit="' + sc.id + '"><header class="banner"><h3 id="bn-' + sc.id + '"><span class="bn-n">SC ' + sceneN[sc.id] + '</span><span>' + esc(sc.slug) + '</span></h3>' +

  /* ── spend gate ───────────────────────────────────────── */
  function renderGate() {
    const b = D.budget, jobs = D.pending_spend;
    const sum = f => jobs.filter(f).reduce((a, j) => a + (j.approved_max != null && f === isApproved ? j.approved_max : j.estimate), 0);
    const isApproved = j => spendStatus(j) === 'approved';
    const awaiting = sum(j => spendStatus(j) === 'awaiting-approval');
    const committed = sum(isApproved);
    const left = b.cap - b.spent - committed - awaiting;
    const pct = v => Math.max(0, Math.min(100, v / b.cap * 100)).toFixed(2);
    const nAw = jobs.filter(j => spendStatus(j) === 'awaiting-approval').length;
    let h = '<div class="gate-head"><h2 class="rh" id="h-spend" tabindex="-1">Spend gate</h2><span class="gate-n">' + (nAw ? nAw + ' waiting for you' : 'Nothing waiting') + '</span></div>';
    h += jobs.length ? jobs.map(jobCard).join('') : '<p class="fine" style="margin-top:10px">No paid jobs queued.</p>';
    const aria = 'Budget: ' + money(b.spent) + ' spent' + (committed ? ', ' + money(committed) + ' approved and not yet charged' : '') + (awaiting ? ', ' + money(awaiting) + ' waiting for approval' : '') + ', ' + money(left) + ' left of a ' + money(b.cap) + ' cap.';
    h += '<div class="meter"><div class="meter-h"><h3 class="sub-h">Budget</h3><span class="mono" data-akuko-field="cap">cap ' + money(b.cap) + ' ' + esc(b.currency) + '</span></div>' +
      '<div class="bar" role="img" aria-label="' + esc(aria) + '">' +
      [['spent', b.spent], ['commit', committed], ['pend', awaiting]].filter(x => x[1] > 0).map(x => '<span class="seg seg-' + x[0] + '" style="width:' + pct(x[1]) + '%"></span>').join('') + '</div>' +
      '<dl class="mrows"><dt><span class="sw sw-spent"></span>Spent so far</dt><dd class="money" data-akuko-field="spent">' + money(b.spent) + '</dd>' +
      (committed ? '<dt><span class="sw sw-commit"></span>Approved, not yet charged</dt><dd class="money">' + money(committed) + '</dd>' : '') +
      (awaiting ? '<dt><span class="sw sw-pend"></span>Waiting for your approval</dt><dd class="money">' + money(awaiting) + '</dd>' : '') +
      '<dt class="tot">' + (awaiting ? 'Left if you approve' : 'Left') + '</dt><dd class="tot money" data-akuko-field="left-if-approved">' + money(left) + '</dd></dl>' +
      (D._note ? '<p class="fine">' + esc(D._note) + '</p>' : '') + '</div>';
    $('#p-spend').innerHTML = h;
  }
  function jobCard(j) {
    const st = spendStatus(j), stg = stageById[j.stage];

    else if (st === 'not-now') act = '<p class="job-done">Parked. akuko won’t run this until you approve it.</p><div class="job-act"><button class="btn btn-sm" type="button" data-act="spend-reset" data-akuko-action="undo" data-akuko-unit="' + j.id + '" data-id="' + j.id + '" data-k="spend-reset:' + j.id + '">Reconsider</button></div>';
    else act = '<div class="job-act"><button class="btn btn-primary" type="button" data-act="spend-ok" data-akuko-action="approve-spend" data-akuko-unit="' + j.id + '" data-id="' + j.id + '" data-k="spend-ok:' + j.id + '">Approve spend · ' + money(j.estimate) + '</button><button class="btn" type="button" data-act="spend-no" data-akuko-action="decline-spend" data-akuko-unit="' + j.id + '" data-id="' + j.id + '" data-k="spend-no:' + j.id + '">Not now</button></div>';

  /* ── bible ────────────────────────────────────────────── */
  function usedIn(bid) { return D.shots.filter(s => (s.refs || []).indexOf(bid) !== -1).length; }
  function bibEntry(it, kind) {
    const bs = bibleStatus(it.id);
    let frames;
    if (it.assets && it.assets.length) {
      frames = it.assets.map((a, i) => {
        const ast = assetStatus(it.id, i);
        return '<figure><div class="ph-frame ph-' + esc(a.kind) + '" data-st="' + esc(ast) + '">' + esc(KIND[a.kind] || a.kind) + '<small>no image in this board</small></div><figcaption>' + chip(ast) + '</figcaption></figure>';
      }).join('');
    } else {
      frames = '<figure><div class="ph-frame" data-st="not-started">' + (kind === 'character' ? 'Turnaround sheet' : 'Location plate') + '<small>generated on approval</small></div></figure>';
    }

      const key = it.id + ':' + i, ast = assetStatus(it.id, i), lab = KIND[a.kind] || a.kind;
      if (ast === 'pending-review') acts += '<div class="bib-act"><span>' + esc(lab) + ' is waiting for you</span><button class="btn btn-sm btn-primary" type="button" data-act="asset-ok" data-akuko-action="approve" data-akuko-unit="' + esc(it.assets[i].id) + '" data-id="' + key + '" data-k="asset-ok:' + key + '">Approve ' + esc(lab.toLowerCase()) + '</button></div>';
      else if (S.assetPrev[key]) acts += '<div class="bib-act" role="status"><span>' + esc(lab) + ' approved.</span><button class="linkbtn" type="button" data-act="asset-undo" data-akuko-action="undo" data-akuko-unit="' + esc(it.assets[i].id) + '" data-id="' + key + '" data-k="asset-undo:' + key + '">Undo</button></div>';
    });
    const n = usedIn(it.id);
    return '<article class="bib" id="bib-' + it.id + '" tabindex="-1" aria-labelledby="bnm-' + it.id + '" data-akuko-field="bible-entry" data-akuko-unit="' + it.id + '" data-akuko-status="' + esc(it._status) + '">' +
      '<div class="bib-h"><h4 class="bib-name" id="bnm-' + it.id + '">' + esc(it.name) + '</h4>' + chip(bs) + '</div>' +

  /* ── ledger ───────────────────────────────────────────── */
  function renderLedger() {
    const rows = D.ledger.map(r => {
      const parts = String(r.unit).split(' · ');
      const e = bibleById[parts[0]];
      const name = e ? e.item.name + (parts[1] ? ' · ' + parts[1] : '') : r.unit;
      const d = new Date(r.ts);
      const t = isNaN(d) ? '' : pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
      const day = isNaN(d) ? '' : MON[d.getUTCMonth()] + ' ' + d.getUTCDate();

    }).join('');

      '<table class="ledger"><caption class="vh">Paid calls so far</caption><thead><tr><th scope="col">Time (UTC)</th><th scope="col">Unit</th><th scope="col" class="amt">Charged</th></tr></thead>' +
      '<tbody>' + rows + '</tbody><tfoot><tr><th scope="row" colspan="2">Total charged</th><td class="amt money" data-akuko-field="ledger-total">' + money(total) + '</td></tr></tfoot></table>' +
      '<p class="check">' + (match ? glyph('approved') + '<span>Matches the budget’s spent figure (' + money(D.budget.spent) + ').</span>' : glyph('needs-rework') + '<span>Budget says ' + money(D.budget.spent) + ' spent; the ledger totals ' + money(total) + '.</span>') + '</p>' +

  /* ── footer ───────────────────────────────────────────── */
  let resetArmed = false;

  /* ── render + focus continuity ────────────────────────── */
  function renderAll(fallbackFocus) {
    const ae = document.activeElement;
    const k = ae && ae.dataset ? ae.dataset.k : null;
    document.documentElement.setAttribute('data-mode', S.mode);
    renderHeader(); renderNext(); renderStages(); renderNav();
    paintScript(); renderShots(); renderGate(); renderBible(); renderLedger(); renderFoot();
    const want = k || fallbackFocus;
    if (want && (!ae || !document.body.contains(ae) || ae === document.body || k)) {
      const el = document.querySelector('[data-k="' + want.replace(/"/g, '\\"') + '"]');
      if (el && el !== ae) el.focus({ preventScroll: true });
      else if (!el && fallbackFocus) { const fb = document.querySelector('[data-k="' + fallbackFocus + '"]'); if (fb) fb.focus({ preventScroll: true }); }
    }
    requestAnimationFrame(layoutLining);
  }
  function commit(fallbackFocus) { save(); renderAll(fallbackFocus); }

  function scrollParent(el) {
    for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      const o = getComputedStyle(p).overflowY;
      if ((o === 'auto' || o === 'scroll') && p.scrollHeight > p.clientHeight) return p;
    }
    return null;
  }
  function reveal(el, block) {
    if (!el) return;
    const sc = scrollParent(el);
    const scrolls = !!sc;
    const r = el.getBoundingClientRect();
    const box = scrolls ? sc.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
    const topPad = scrolls ? 64 : (isMobile() ? 130 : 16);
    if (r.top >= box.top + topPad && r.bottom <= box.bottom - 12) return;
    el.scrollIntoView({ block: block || 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  function pulseLine(id) {
    const ln = document.getElementById('ln-' + id);
    if (!ln) return;
    ln.classList.remove('pulse'); void ln.offsetWidth; ln.classList.add('pulse');
  }

  /* ── actions ──────────────────────────────────────────── */
  function selectShot(id, from, opts) {
    if (!shotsById[id]) return;
    const toggle = from === 'row' && S.sel === id;
    S.sel = toggle ? null : id;
    if (!S.compose || S.compose.id !== S.sel) S.compose = null;
    if (!S.flash || S.flash.id !== S.sel) S.flash = null;
    if (!isWide() && !(isMobile() && from === 'toscript')) {
      if (isMobile() ? (from !== 'row') : (S.view !== 'script' && S.view !== 'shots')) S.view = 'shots';
    }
    save();
    renderAll((opts && opts.focus) || null);
    if (toggle) return;
    requestAnimationFrame(() => {
      const row = $('#shot-' + id + ' .shot-row');
      if (from !== 'row') reveal(row, 'start');
      if (from === 'row' && row) reveal(row, 'nearest');
      if (isWide() || (!isMobile())) reveal(document.getElementById('ln-' + id), 'center');
    });
  }
  function noteFor(kind, text) {
    return { nid: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: new Date().toISOString(), stage: currentStage.id, author: 'You', kind: kind, text: text || '' };
  }
  function setShot(id, st, kind, text) {
    const prevSt = shotStatus(id);
    const n = noteFor(kind, text);
    (S.notes[id] = S.notes[id] || []).push(n);
    if (st) { if (st === shotsById[id].status) delete S.status[id]; else S.status[id] = st; }
    S.prev[id] = { st: prevSt, nid: n.nid };
    decide({ action: kind === 'request' ? 'request-changes' : kind, unit: id, stage: shotsById[id].stage, text: text || '' });
  }
  function openGate() {
    if (!isWide()) S.view = 'spend';
    save(); renderAll();
    requestAnimationFrame(() => { const h = $('#h-spend'); if (h) { reveal(h, 'start'); h.focus({ preventScroll: true }); } });
  }
  function openBible(bid) {
    S.rail = 'bible';
    if (!isWide()) S.view = 'bible';
    save(); renderAll();
    requestAnimationFrame(() => {
      const el = document.getElementById('bib-' + bid);
      if (!el) return;
      el.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      el.focus({ preventScroll: true });
    });
  }
  function submitCompose(form) {
    const id = form.dataset.id, ta = $('#compose-text', form), text = ta.value.trim();
    if (!S.compose) return;
    if (!text) {
      $('#compose-err', form).textContent = S.compose.mode === 'request' ? 'Say what should change, so akuko can act on it.' : 'Write the note first.';
      ta.setAttribute('aria-invalid', 'true'); ta.focus(); return;
    }
    if (S.compose.mode === 'request') { setShot(id, 'needs-rework', 'request', text); S.flash = { id: id, text: 'Sent back to akuko with your note.' }; announce(id + ' sent back to akuko'); }
    else { setShot(id, null, 'note', text); S.flash = { id: id, text: 'Note added to the thread.' }; announce('Note added to ' + id); }
    S.compose = null;
    commit('approve:' + id);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) {
      const ln = e.target.closest('#page .ln');
      if (ln) selectShot(ln.dataset.shot, 'script');
      return;
    }
    const a = t.dataset.act, id = t.dataset.id;
    if (t.getAttribute('aria-disabled') === 'true') return;
    if (a !== 'reset' && resetArmed) { resetArmed = false; }
    switch (a) {
      case 'sel': selectShot(id, 'row'); break;
      case 'sel-tag': selectShot(id, 'script', { focus: 'tag:' + id }); break;
      case 'sel-unit': case 'goto': selectShot(id, 'gate', { focus: 'sel:' + id }); break;
      case 'approve':
        setShot(id, 'approved', 'approve', '');
        S.compose = null; S.flash = { id: id, text: 'Approved. akuko picks this up on its next action.' };
        announce(id + ' approved'); commit('approve:' + id); break;
      case 'request': case 'note':
        S.compose = { id: id, mode: a, text: (S.compose && S.compose.id === id && S.compose.mode === a) ? S.compose.text : '' };
        S.flash = null; renderAll();
        requestAnimationFrame(() => { const ta = $('#compose-text'); if (ta) ta.focus(); });
        break;
      case 'c-cancel': S.compose = null; renderAll((S.sel ? 'approve:' + S.sel : null)); break;
      case 'undo': {
        const p = S.prev[id]; if (!p) return;
        if (p.st === shotsById[id].status) delete S.status[id]; else S.status[id] = p.st;
        if (S.notes[id]) { S.notes[id] = S.notes[id].filter(n => n.nid !== p.nid); if (!S.notes[id].length) delete S.notes[id]; }
        delete S.prev[id]; S.flash = null;
        const ud = lastDecision(id); if (ud) decide({ action: 'undo', unit: id, stage: shotsById[id].stage, undoes: ud.id });
        announce('Undone. ' + id + ' is ' + ST[shotStatus(id)].label.toLowerCase()); commit('approve:' + id); break;
      }
      case 'next': {
        const n = nextPending(S.sel);
        if (n) selectShot(n, 'gate', { focus: 'sel:' + n });
        else if (S.sel && shotStatus(S.sel) === 'pending-review') selectShot(S.sel, 'gate', { focus: 'sel:' + S.sel });
        else if (awaitingSpend().length) openGate();
        else if (pendingAssets().length) openBible(pendingAssets()[0].bid);
        break;
      }
      case 'toscript': {
        if (isMobile()) { S.view = 'script'; save(); renderAll(); }
        requestAnimationFrame(() => requestAnimationFrame(() => {
          layoutLining();
          const ln = document.getElementById('ln-' + id);
          if (ln) { ln.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); pulseLine(id); }
          const tag = $('.tag[data-id="' + id + '"]'); if (tag) tag.focus({ preventScroll: true });
        }));
        break;
      }
      case 'ref': openBible(id); break;
      case 'filter': S.filter = id; commit('filter:' + id); break;
      case 'view': {
        S.view = id; save(); renderAll('view:' + id);
        const target = { script: '#script', shots: '#shots', spend: '#p-spend', bible: '#p-bible', ledger: '#p-ledger' }[id];
        if (isMobile()) { const nav = $('#desknav'); const y = nav.getBoundingClientRect().top + window.scrollY; if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'auto' }); }
        if (id === 'shots') requestAnimationFrame(() => { if (S.sel) reveal($('#shot-' + S.sel + ' .shot-row'), 'start'); });
        if (id === 'script') requestAnimationFrame(() => { layoutLining(); });
        void target; break;
      }
      case 'rail': S.rail = id; commit('rail:' + id); break;
      case 'stage': if (id === 'spend') openGate(); else if (id === 'bible') openBible((pendingAssets()[0] || { bid: '' }).bid); else { if (!isWide()) S.view = 'shots'; save(); renderAll(); requestAnimationFrame(() => { const h = $('#h-shots'); if (h) reveal(h, 'start'); }); } break;
      case 'spend-ok': {
        const j = D.pending_spend.find(x => x.id === id); if (!j) return;
        S.spend[id] = 'approved'; decide({ action: 'approve-spend', unit: id, stage: j.stage, text: 'approve ' + gateNum(j.approved_max != null ? j.approved_max : j.estimate) + ' ' + D.budget.currency });
        announce('Spend approved: ' + money(j.estimate) + ' for ' + j.label); commit('spend-reset:' + id); break;
      }
      case 'spend-no': { const j = D.pending_spend.find(x => x.id === id); S.spend[id] = 'not-now'; if (j) decide({ action: 'decline-spend', unit: id, stage: j.stage }); announce('Spend parked'); commit('spend-reset:' + id); break; }
      case 'spend-reset': { delete S.spend[id]; const sd = lastDecision(id), j = D.pending_spend.find(x => x.id === id); if (sd && j) decide({ action: 'undo', unit: id, stage: j.stage, undoes: sd.id }); announce('Spend is waiting for your decision again'); commit('spend-ok:' + id); break; }
      case 'asset-ok': {
        const parts = id.split(':'); S.assetPrev[id] = assetStatus(parts[0], +parts[1]);
        S.asset[id] = 'approved'; { const a = bibleById[parts[0]].item.assets[+parts[1]]; decide({ action: 'approve', unit: a.id, stage: a.stage }); } announce('Bible item approved'); commit('asset-undo:' + id); break;
      }
      case 'asset-undo': {
        const parts = id.split(':'), orig = bibleById[parts[0]].item.assets[+parts[1]].status, pv = S.assetPrev[id];
        if (pv === orig) delete S.asset[id]; else S.asset[id] = pv;
        delete S.assetPrev[id]; { const a = bibleById[parts[0]].item.assets[+parts[1]], ad = lastDecision(a.id); if (ad) decide({ action: 'undo', unit: a.id, stage: a.stage, undoes: ad.id }); } announce('Undone'); commit('asset-ok:' + id); break;
      }
      case 'mode': S.mode = S.mode === 'dark' ? 'light' : 'dark'; commit('mode'); break;
      case 'export': try { navigator.clipboard.writeText(W.jsonl()); announce('Decisions copied. Paste them to akuko.'); } catch (e) { announce('Copy failed'); } break;
      case 'reset':
        if (!resetArmed) { resetArmed = true; renderFoot(); const rb = $('[data-k="reset"]'); if (rb) rb.focus(); setTimeout(() => { if (resetArmed) { resetArmed = false; renderFoot(); } }, 5000); return; }
        resetArmed = false; store.clear();
        S.status = {}; S.notes = {}; S.asset = {}; S.spend = {}; S.prev = {}; S.assetPrev = {}; S.compose = null; S.flash = null; S.filter = 'all';
        announce('Board reset to the fixture'); commit('reset'); break;
    }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form="compose"]');
    if (!f) return;
    e.preventDefault(); submitCompose(f);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'compose-text' && S.compose) {
      S.compose.text = e.target.value;
      if (e.target.value.trim()) { e.target.removeAttribute('aria-invalid'); const er = $('#compose-err'); if (er) er.textContent = ''; }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'compose-text') {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitCompose(e.target.form); return; }
      if (e.key === 'Escape') { e.preventDefault(); const id = S.compose && S.compose.id; S.compose = null; renderAll(id ? 'approve:' + id : null); return; }
    }
    if (e.target.getAttribute && e.target.getAttribute('role') === 'tab' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home' || e.key === 'End')) {
      e.preventDefault();
      const tabs = $$('#rail-tabs [role="tab"]'), i = tabs.indexOf(e.target);
      const n = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      S.rail = tabs[n].dataset.id; commit('rail:' + S.rail);
    }
  });

  /* linked hover: script line <-> tramline <-> shot row */
  let hoverId = null;
  function paintHover() {
    $$('.is-hint').forEach(el => el.classList.remove('is-hint'));
    if (!hoverId) return;
    const ln = document.getElementById('ln-' + hoverId); if (ln) ln.classList.add('is-hint');
    $$('#lining [data-id="' + hoverId + '"]').forEach(el => el.classList.add('is-hint'));
    const row = $('#shot-' + hoverId + ' > .shot-row'); if (row) row.classList.add('is-hint');
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest ? e.target.closest('[data-hover]') : null;
    const id = el ? el.dataset.hover : null;
    if (id !== hoverId) { hoverId = id; paintHover(); }
  });

  /* ── boot ─────────────────────────────────────────────── */
  buildScript();
  renderAll();
  const relayout = () => requestAnimationFrame(layoutLining);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe($('#paper'));
  window.addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout).catch(() => {});
  const onMq = () => { renderNav(); relayout(); };
  [mqMobile, mqWide].forEach(mq => { if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); });
  window.addEventListener('load', () => { renderHeader(); relayout(); });
  requestAnimationFrame(() => {
    layoutLining();
    if (S.sel && !isMobile()) {
      const row = $('#shot-' + S.sel + ' .shot-row');
      if (row) row.scrollIntoView({ block: 'start' });
      const ln = document.getElementById('ln-' + S.sel);
      if (ln) { const sc = $('#script-scroll'); if (sc) sc.scrollTop = Math.max(0, ln.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 3); }
      window.scrollTo(0, 0);
    }
  });
})();
</script>
</body>
</html>
